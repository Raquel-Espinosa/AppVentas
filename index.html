<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ventas - Cajas de Huevo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        html, body { height: 100%; margin: 0; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgF1W6GhcPPm0TTUcIq7r2JP5qufXizBPkKPgqpgIGVI6qQmKjPQ_0j2yR_qVT4KglRw/exec";

        const sendPostRequest = async (data) => {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error("Error en POST:", error);
                return { status: 'error', message: error.message };
            }
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                User: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                MapPin: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
                Phone: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
                MessageCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
                LogOut: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
                Save: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
                Loader: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className} animate-spin"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>`,
                Trash2: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
                Plus: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
                ArrowUp: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m18 15-6-6-6 6"/></svg>`,
                ArrowDown: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m6 9 6 6 6-6"/></svg>`,
                CalendarDays: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>`,
                CheckCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
                ScanLine: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" x2="17" y1="12" y2="12"/></svg>`,
                FileText: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
                Edit: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>`
            };
            return <span dangerouslySetInnerHTML={{ __html: icons[name] || '' }} />;
        };

        const CustomModal = ({ config, onClose }) => {
            if (!config) return null;
            const { type, title, message, onConfirm, defaultValue = '' } = config;
            const [inputValue, setInputValue] = useState(defaultValue);

            const handleConfirm = () => {
                if (type === 'prompt') onConfirm(inputValue);
                else if (onConfirm) onConfirm();
                onClose();
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
                        <div className="p-5">
                            <h3 className="text-lg font-bold text-slate-800 mb-2">{title || 'Atención'}</h3>
                            <p className="text-sm text-slate-600 mb-4">{message}</p>
                            
                            {type === 'prompt' && (
                                <input 
                                    type="text" 
                                    value={inputValue} 
                                    onChange={(e) => setInputValue(e.target.value)}
                                    className="w-full p-2 border border-slate-300 rounded-lg mb-4 outline-none focus:ring-2 focus:ring-amber-500"
                                    placeholder="Escribe aquí..."
                                    autoFocus
                                />
                            )}

                            <div className="flex gap-3 justify-end mt-2">
                                {type === 'prompt' || type === 'confirm' ? (
                                    <button onClick={onClose} className="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancelar</button>
                                ) : null}
                                <button onClick={handleConfirm} className="px-4 py-2 text-sm font-medium text-white bg-amber-600 hover:bg-amber-700 rounded-lg transition shadow-sm">
                                    Aceptar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- VISTA VENDEDOR ---
        const VendedorView = ({ user, setOrders, clientes, productos, showModal }) => {
            const [telefono, setTelefono] = useState("");
            const [cliente, setCliente] = useState(null);
            const [fecha, setFecha] = useState("");
            const [observaciones, setObservaciones] = useState("");
            const [lineas, setLineas] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (productos && productos.length > 0 && lineas.length === 0) {
                    setLineas([{ id: Date.now(), productoId: productos[0].id || productos[0].nombre, cantidad: 1, precioAsignado: "" }]);
                }
            }, [productos, lineas.length]);

            const buscarCliente = () => {
                const encontrado = clientes.find(c => {
                    const telDb = String(c.telefono || c.teléfono || "").trim();
                    return telDb === telefono.trim();
                });
                setCliente(encontrado || { noEncontrado: true });
            };

            const agregarLinea = () => {
                const defaultProd = productos.length > 0 ? (productos[0].id || productos[0].nombre) : "";
                setLineas([...lineas, { id: Date.now(), productoId: defaultProd, cantidad: 1, precioAsignado: "" }]);
            };

            const actualizarLinea = (id, campo, valor) => setLineas(lineas.map(l => l.id === id ? { ...l, [campo]: valor } : l));

            const guardarPedido = async (e) => {
                e.preventDefault();
                if (lineas.length === 0) return showModal({ type: 'alert', message: "Agrega al menos un producto." });
                setLoading(true);

                const baseId = Date.now().toString().slice(-6);
                let successCount = 0;
                const nuevosPedidos = [];

                for (let i = 0; i < lineas.length; i++) {
                    const linea = lineas[i];
                    const prodSeleccionado = productos.find(p => (p.id || p.nombre) === linea.productoId);
                    const nombreProducto = prodSeleccionado ? (prodSeleccionado.nombre || prodSeleccionado.producto) : linea.productoId;

                    const nuevoPedido = {
                        id: lineas.length > 1 ? `PED-${baseId}-${i+1}` : `PED-${baseId}`,
                        vendedorId: user.id || user.nombre,
                        cliente: {
                            telefono: cliente.telefono || cliente.teléfono,
                            negocio: cliente.negocio,
                            ubicacion: cliente.ubicacion || cliente.ubicación
                        },
                        producto: nombreProducto,
                        cantidad: linea.cantidad,
                        fechaEntrega: fecha,
                        observaciones: observaciones,
                        precioAsignado: parseFloat(linea.precioAsignado) || 0 
                    };

                    const res = await sendPostRequest({ action: 'nuevoPedido', pedido: nuevoPedido });

                    if (res.status === 'success') {
                        successCount++;
                        nuevosPedidos.push({ ...nuevoPedido, estado: 'Pendiente', kilosPorCaja: 0 });
                    }
                }

                if (successCount === lineas.length) {
                    setOrders(prev => [...prev, ...nuevosPedidos]);
                    showModal({ type: 'alert', title: '¡Éxito!', message: "Pedido guardado con éxito." });
                    setTelefono(""); setCliente(null); setFecha(""); setObservaciones("");
                    const defaultProd = productos.length > 0 ? (productos[0].id || productos[0].nombre) : "";
                    setLineas([{ id: Date.now(), productoId: defaultProd, cantidad: 1, precioAsignado: "" }]);
                } else {
                    showModal({ type: 'alert', title: 'Error', message: "Error al guardar. Verifica tu conexión." });
                }
                setLoading(false);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <h2 className="text-2xl font-bold text-amber-600">Nuevo Pedido</h2>
                    
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <label className="block text-sm font-medium text-slate-700 mb-2">Teléfono del Cliente</label>
                        <div className="flex flex-col sm:flex-row gap-2">
                            <input type="text" value={telefono} onChange={e => setTelefono(e.target.value)} placeholder="Ej. 5551234567" className="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" />
                            <button onClick={buscarCliente} className="bg-amber-500 text-white px-6 py-3 rounded-xl font-medium hover:bg-amber-600 transition flex items-center justify-center gap-2">Buscar</button>
                        </div>

                        {cliente && !cliente.noEncontrado && (
                            <div className="mt-4 p-4 bg-slate-50 rounded-xl border border-slate-100 text-sm shadow-inner">
                                <p><strong>Nombre del negocio:</strong> {cliente.negocio}</p>
                                <p><strong>Encargado:</strong> {cliente.encargado}</p>
                                <div className="mt-2 p-2 bg-slate-100 rounded text-slate-700 border border-slate-200">
                                    <strong>Dirección / Referencias:</strong> 
                                    <span className="italic block mt-1">{cliente['dirección_/_referencias'] || cliente['direccion_/_referencias'] || cliente.referencias || cliente.direccion || "Sin referencias detalladas."}</span>
                                </div>
                                <p className="flex items-center gap-1 mt-3">
                                    <strong>Ubicación:</strong> {cliente.ubicacion || cliente.ubicación} 
                                </p>
                            </div>
                        )}
                        {cliente?.noEncontrado && <p className="text-red-500 text-sm mt-3 font-medium">Cliente no encontrado en la base de datos.</p>}
                    </div>

                    {cliente && !cliente.noEncontrado && (
                        <form onSubmit={guardarPedido} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                            <h3 className="font-semibold text-lg border-b pb-3 text-slate-800">Detalles del Pedido y Cotización</h3>
                            
                            <div className="space-y-3">
                                <label className="block text-sm font-medium text-slate-700">Productos a surtir</label>
                                {lineas.map((linea) => (
                                    <div key={linea.id} className="flex gap-2 items-center bg-slate-50 p-2 rounded-xl border border-slate-100 flex-wrap sm:flex-nowrap">
                                        <div className="flex-1 min-w-[150px]">
                                            <select value={linea.productoId} onChange={e => actualizarLinea(linea.id, 'productoId', e.target.value)} className="w-full p-2 border-none bg-transparent outline-none text-sm font-medium text-slate-700">
                                                {productos.map(p => <option key={p.id || p.nombre} value={p.id || p.nombre}>{p.nombre || p.producto}</option>)}
                                            </select>
                                        </div>
                                        <div className="w-20">
                                            <input type="number" min="1" value={linea.cantidad} onChange={e => actualizarLinea(linea.id, 'cantidad', e.target.value)} className="w-full p-2 border border-slate-200 rounded-lg outline-none text-center text-sm" required placeholder="Cajas" title="Cantidad de Cajas" />
                                        </div>
                                        <div className="w-24 relative">
                                            <span className="absolute left-2 top-2.5 text-slate-400 text-sm">$</span>
                                            <input type="number" step="0.01" value={linea.precioAsignado} onChange={e => actualizarLinea(linea.id, 'precioAsignado', e.target.value)} className="w-full p-2 pl-6 border border-slate-200 rounded-lg outline-none text-sm" required placeholder="Precio/Kg" title="Precio por Kilo" />
                                        </div>
                                        {lineas.length > 1 && (
                                            <button type="button" onClick={() => setLineas(lineas.filter(l => l.id !== linea.id))} className="p-2 text-red-500 hover:bg-red-100 rounded-lg transition" title="Quitar"><Icon name="Trash2" size={18} /></button>
                                        )}
                                    </div>
                                ))}
                                <button type="button" onClick={agregarLinea} className="text-sm font-semibold text-amber-600 hover:text-amber-700 flex items-center gap-1 mt-2 p-2 hover:bg-amber-50 rounded-lg transition w-max">
                                    <Icon name="Plus" size={16} /> Añadir otra variedad
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-100">
                                <div>
                                    <label className="block text-sm font-medium mb-1 text-slate-700">Fecha de Entrega</label>
                                    <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500" required />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium mb-1 text-slate-700">Observaciones</label>
                                    <textarea value={observaciones} onChange={e => setObservaciones(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500" rows="2" placeholder="Ej. Entregar después de las 2 PM..."></textarea>
                                </div>
                            </div>
                            
                            <button type="submit" disabled={loading} className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition shadow-md">
                                {loading ? 'Guardando...' : 'Confirmar y Enviar Pedido'}
                            </button>
                        </form>
                    )}
                </div>
            );
        };

        // --- VISTA ADMINISTRADOR ---
        const AdminView = ({ orders, setOrders, users, setUsers, showModal }) => {
            const [tab, setTab] = useState('pedidos');
            const [loadingId, setLoadingId] = useState(null);
            const hoy = new Date().toISOString().split('T')[0];
            const [filtroFechaPedidos, setFiltroFechaPedidos] = useState(hoy);
            const [dashRangoInicio, setDashRangoInicio] = useState(hoy);
            const [dashRangoFin, setDashRangoFin] = useState(hoy);
            const [dashRepartidor, setDashRepartidor] = useState('');
            const [editState, setEditState] = useState({});
            const [isUserModalOpen, setIsUserModalOpen] = useState(false);
            const [currentUserForm, setCurrentUserForm] = useState({ id: '', nombre: '', rol: 'vendedor', usuario: '', password: '' });
            const [loadingUser, setLoadingUser] = useState(false);

            const groupedOrders = useMemo(() => {
                let list = [...orders];
                if (filtroFechaPedidos && tab === 'pedidos') {
                    list = list.filter(o => o.fechaEntrega === filtroFechaPedidos);
                }
                list.sort((a, b) => new Date(a.fechaEntrega) - new Date(b.fechaEntrega));

                const groupsMap = {};
                list.forEach(o => {
                    const key = `${o.cliente.telefono}-${o.fechaEntrega}`;
                    if (!groupsMap[key]) {
                        groupsMap[key] = { id: key, cliente: o.cliente, fechaEntrega: o.fechaEntrega, estado: o.estado, repartidorId: o.repartidorId, observaciones: o.observaciones, items: [] };
                    }
                    groupsMap[key].items.push(o);
                });
                return Object.values(groupsMap);
            }, [orders, filtroFechaPedidos, tab]);

            useEffect(() => {
                const state = {};
                groupedOrders.forEach(group => {
                    state[group.id] = { repartidorId: group.repartidorId || "", fechaEntrega: group.fechaEntrega || "" };
                });
                setEditState(state);
            }, [groupedOrders, orders]);

            const handleGroupEdit = (groupId, field, value) => setEditState(prev => ({ ...prev, [groupId]: { ...prev[groupId], [field]: value } }));

            const guardarCambiosGrupo = async (group) => {
                setLoadingId(group.id);
                const cambiosGrupo = editState[group.id];
                
                let allSuccess = true;
                const promesas = group.items.map(async (item) => {
                    const dataToSave = {
                        action: 'actualizarPedido',
                        pedidoId: item.id,
                        repartidorId: cambiosGrupo.repartidorId,
                        fechaEntrega: cambiosGrupo.fechaEntrega,
                        estado: cambiosGrupo.repartidorId ? (item.estado === 'Pendiente' ? 'Asignado' : item.estado) : 'Pendiente'
                    };
                    const res = await sendPostRequest(dataToSave);
                    if (res.status !== 'success') allSuccess = false;
                    return { item, dataToSave, res };
                });

                const resultados = await Promise.all(promesas);
                if (allSuccess) {
                    setOrders(prev => prev.map(o => {
                        const target = resultados.find(r => r.item.id === o.id);
                        if (target) return { ...o, repartidorId: target.dataToSave.repartidorId, fechaEntrega: target.dataToSave.fechaEntrega, estado: target.dataToSave.estado };
                        return o;
                    }));
                    showModal({ type: 'alert', message: "Asignación actualizada." });
                }
                setLoadingId(null);
            };

            const handleSaveUser = async (e) => {
                e.preventDefault();
                setLoadingUser(true);
                const isNew = !currentUserForm.id;
                const userData = { ...currentUserForm, id: isNew ? `U-${Date.now()}` : currentUserForm.id };
                
                const res = await sendPostRequest({ action: isNew ? 'crearUsuario' : 'actualizarUsuario', usuario: userData });
                
                if (res.status === 'success') {
                    if (isNew) setUsers([...users, userData]);
                    else setUsers(users.map(u => u.id === userData.id ? userData : u));
                    setIsUserModalOpen(false);
                } else showModal({ type: 'alert', message: "Error al guardar usuario" });
                setLoadingUser(false);
            };

            const handleDeleteUser = (id) => {
                showModal({
                    type: 'confirm', title: 'Eliminar Usuario', message: '¿Estás seguro de eliminar este acceso?',
                    onConfirm: async () => {
                        const res = await sendPostRequest({ action: 'eliminarUsuario', id });
                        if (res.status === 'success') setUsers(users.filter(u => u.id !== id));
                    }
                });
            };

            const repartidores = users.filter(u => u.rol && u.rol.toLowerCase() === 'repartidor');

            const pedidosDash = orders.filter(o => {
                let pasa = true;
                if (dashRangoInicio) pasa = pasa && o.fechaEntrega >= dashRangoInicio;
                if (dashRangoFin) pasa = pasa && o.fechaEntrega <= dashRangoFin;
                if (dashRepartidor) pasa = pasa && o.repartidorId === dashRepartidor;
                return pasa;
            });

            return (
                <div className="space-y-6">
                    <div className="flex space-x-1 border-b border-slate-200 overflow-x-auto pb-1">
                        {['pedidos', 'usuarios', 'dashboard'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-5 py-3 font-medium capitalize rounded-t-lg transition whitespace-nowrap ${tab === t ? 'text-amber-700 bg-amber-50 border-b-2 border-amber-600' : 'text-slate-500 hover:text-amber-600 hover:bg-slate-50'}`}>
                                {t}
                            </button>
                        ))}
                    </div>

                    {tab === 'pedidos' && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <span className="font-semibold text-slate-700 flex items-center gap-2"><Icon name="CalendarDays" size={20}/> Fecha de Entrega:</span>
                                    <input type="date" value={filtroFechaPedidos} onChange={e => setFiltroFechaPedidos(e.target.value)} className="p-2 border border-slate-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-amber-500" />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setFiltroFechaPedidos('')} className="text-sm px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 transition">Ver Todos</button>
                                    <button onClick={() => setFiltroFechaPedidos(hoy)} className="text-sm px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 font-medium hover:bg-amber-200 transition">Ver Hoy</button>
                                </div>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                                        <tr>
                                            <th className="p-4">Cliente / Contacto</th>
                                            <th className="p-4">Productos</th>
                                            <th className="p-4">Asignación</th>
                                            <th className="p-4 text-center">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {groupedOrders.map(group => (
                                            <tr key={group.id} className="hover:bg-slate-50/80 transition align-top">
                                                <td className="p-4 min-w-[200px]">
                                                    <div className="font-bold text-slate-800 text-base">{group.cliente.negocio}</div>
                                                    <span className={`inline-block mt-1 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${group.estado === 'Entregado' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{group.estado}</span>
                                                </td>
                                                <td className="p-4">
                                                    <div className="space-y-2">
                                                        {group.items.map(item => (
                                                            <div key={item.id} className="bg-white border border-slate-200 p-2 rounded flex flex-col text-xs">
                                                                <div className="font-bold"><span className="text-amber-600">{item.cantidad}x</span> {item.producto}</div>
                                                                <div className="text-slate-500 mt-1">Cotizado a: ${item.precioAsignado}/Kg | Físico: {item.kilosPorCaja > 0 ? `${item.kilosPorCaja}Kg` : '?'}</div>
                                                                {item.metodoPago && <div className="text-green-700 mt-1">Pago: {item.metodoPago}</div>}
                                                                {item.codigoEscaneado && <div className="text-blue-700 mt-1">Cod: {item.codigoEscaneado}</div>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </td>
                                                <td className="p-4 space-y-4">
                                                    {editState[group.id] && (
                                                        <>
                                                            <input type="date" value={editState[group.id].fechaEntrega} onChange={(e) => handleGroupEdit(group.id, 'fechaEntrega', e.target.value)} className="w-full p-2 border border-slate-300 rounded text-sm bg-white" />
                                                            <select value={editState[group.id].repartidorId} onChange={(e) => handleGroupEdit(group.id, 'repartidorId', e.target.value)} className="w-full p-2 border border-slate-300 rounded text-sm bg-white">
                                                                <option value="">Sin asignar</option>
                                                                {repartidores.map(r => <option key={r.id || r.nombre} value={r.id || r.nombre}>{r.nombre}</option>)}
                                                            </select>
                                                        </>
                                                    )}
                                                </td>
                                                <td className="p-4 text-center">
                                                    <button onClick={() => guardarCambiosGrupo(group)} disabled={loadingId === group.id} className="bg-amber-500 text-white p-2 rounded-xl hover:bg-amber-600 mx-auto block">
                                                        {loadingId === group.id ? <Icon name="Loader" /> : <Icon name="Save" />}
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {tab === 'usuarios' && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <div className="flex justify-between items-center mb-4 border-b pb-4">
                                <h3 className="font-semibold text-lg text-slate-800">Administración de Usuarios</h3>
                                <button onClick={() => { setCurrentUserForm({ id: '', nombre: '', rol: 'vendedor', usuario: '', password: '' }); setIsUserModalOpen(true); }} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-emerald-700 flex items-center gap-2 text-sm">
                                    <Icon name="Plus" size={16}/> Nuevo Usuario
                                </button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 text-slate-600">
                                        <tr>
                                            <th className="p-3">Nombre</th>
                                            <th className="p-3">Rol</th>
                                            <th className="p-3">Usuario</th>
                                            <th className="p-3 text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {users.map((u) => (
                                            <tr key={u.id} className="hover:bg-slate-50">
                                                <td className="p-3 font-medium text-slate-800">{u.nombre}</td>
                                                <td className="p-3"><span className="px-2 py-1 bg-slate-100 rounded-md text-xs font-bold uppercase">{u.rol}</span></td>
                                                <td className="p-3 text-slate-500 font-mono">{u.usuario}</td>
                                                <td className="p-3 flex justify-center gap-2">
                                                    <button onClick={() => { setCurrentUserForm(u); setIsUserModalOpen(true); }} className="p-2 text-blue-600 hover:bg-blue-50 rounded"><Icon name="Edit" size={18}/></button>
                                                    <button onClick={() => handleDeleteUser(u.id)} className="p-2 text-red-600 hover:bg-red-50 rounded"><Icon name="Trash2" size={18}/></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    
                    {tab === 'dashboard' && (
                        <div className="space-y-6">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-5">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Desde Fecha</label>
                                    <input type="date" value={dashRangoInicio} onChange={e => setDashRangoInicio(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-amber-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Hasta Fecha</label>
                                    <input type="date" value={dashRangoFin} onChange={e => setDashRangoFin(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-amber-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Filtro por Repartidor</label>
                                    <select value={dashRepartidor} onChange={e => setDashRepartidor(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-amber-500">
                                        <option value="">Todos</option>
                                        {repartidores.map(r => <option key={r.id || r.nombre} value={r.id || r.nombre}>{r.nombre}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-slate-400"></div>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Total Entregas</p>
                                    <p className="text-4xl font-black text-slate-800">{new Set(pedidosDash.map(o => o.cliente.telefono + o.fechaEntrega)).size}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Cajas (General)</p>
                                    <p className="text-4xl font-black text-slate-800">{pedidosDash.reduce((sum, o) => sum + Number(o.cantidad), 0)}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Kilos Estimados</p>
                                    <p className="text-4xl font-black text-slate-800">{pedidosDash.reduce((sum, o) => sum + (Number(o.cantidad) * Number(o.kilosPorCaja || 0)), 0)}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Ingresos de Entregados</p>
                                    <p className="text-4xl font-black text-blue-600">
                                        ${pedidosDash.filter(o => o.estado === 'Entregado').reduce((acc, curr) => acc + (Number(curr.cantidad) * Number(curr.kilosPorCaja || 0) * Number(curr.precioAsignado || 0)), 0).toFixed(2)}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Modal User */}
                    {isUserModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden p-6">
                                <h3 className="text-lg font-bold text-slate-800 mb-4">{currentUserForm.id ? 'Editar Usuario' : 'Nuevo Usuario'}</h3>
                                <form onSubmit={handleSaveUser} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Nombre Completo</label>
                                        <input type="text" required value={currentUserForm.nombre} onChange={e => setCurrentUserForm({...currentUserForm, nombre: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Rol en el Sistema</label>
                                        <select value={currentUserForm.rol} onChange={e => setCurrentUserForm({...currentUserForm, rol: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none">
                                            <option value="admin">Administrador</option>
                                            <option value="vendedor">Vendedor</option>
                                            <option value="repartidor">Repartidor</option>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Usuario (Login)</label>
                                            <input type="text" required value={currentUserForm.usuario} onChange={e => setCurrentUserForm({...currentUserForm, usuario: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Contraseña</label>
                                            <input type="text" required value={currentUserForm.password} onChange={e => setCurrentUserForm({...currentUserForm, password: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-3 mt-4 pt-4 border-t">
                                        <button type="button" onClick={() => setIsUserModalOpen(false)} className="px-4 py-2 text-slate-600 bg-slate-100 rounded-lg">Cancelar</button>
                                        <button type="submit" disabled={loadingUser} className="px-4 py-2 bg-amber-600 text-white rounded-lg font-bold">{loadingUser ? 'Guardando...' : 'Guardar'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ScannerModal = ({ onScan, onClose }) => {
            useEffect(() => {
                const html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: { width: 250, height: 100 } }, false);
                html5QrcodeScanner.render((decodedText) => {
                    html5QrcodeScanner.clear();
                    onScan(decodedText);
                }, () => {});
                return () => { try { html5QrcodeScanner.clear(); } catch(e){} };
            }, []);

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                    <div className="bg-white p-5 rounded-2xl w-full max-w-sm shadow-xl">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="ScanLine" /> Escanear Código</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-red-500 bg-slate-100 p-2 rounded-full"><Icon name="Trash2" size={16}/></button>
                        </div>
                        <div id="qr-reader" className="w-full overflow-hidden rounded-lg border-2 border-amber-200"></div>
                        <button onClick={onClose} className="mt-4 w-full bg-slate-100 text-slate-600 py-3 rounded-xl font-bold">Cancelar</button>
                    </div>
                </div>
            );
        };

        // --- VISTA REPARTIDOR ---
        const RepartidorView = ({ user, orders, setOrders, clientes, showModal }) => {
            const [loadingId, setLoadingId] = useState(null);
            const hoy = new Date().toISOString().split('T')[0];
            const [filtroFecha, setFiltroFecha] = useState(hoy);
            
            // Pestañas (Tabs)
            const [tabRuta, setTabRuta] = useState('pendientes'); 
            
            const [orderedGroups, setOrderedGroups] = useState([]);
            const [kilosFisicos, setKilosFisicos] = useState({});
            const [metodosPago, setMetodosPago] = useState({});
            const [codigosBarras, setCodigosBarras] = useState({});
            const [scannerActivo, setScannerActivo] = useState(null);

            useEffect(() => {
                const filtrados = orders.filter(o => o.repartidorId === (user.id || user.nombre) && o.fechaEntrega === filtroFecha);
                const groupsMap = {};
                const currentKilos = { ...kilosFisicos };
                const currentCodigos = { ...codigosBarras };

                filtrados.forEach(o => {
                    const key = `${o.cliente.telefono}`;
                    if (!groupsMap[key]) groupsMap[key] = { id: key, cliente: o.cliente, estado: o.estado, observaciones: o.observaciones, items: [] };
                    groupsMap[key].items.push(o);
                    
                    if(currentKilos[o.id] === undefined) currentKilos[o.id] = o.kilosPorCaja || "";
                    if(currentCodigos[o.id] === undefined) currentCodigos[o.id] = o.codigoEscaneado || "";
                });
                
                // Mantiene el orden de los arreglos existentes si se actualizan, y añade los nuevos al final
                setOrderedGroups(prev => {
                    const currentIds = prev.map(g => g.id);
                    const merged = prev.filter(g => groupsMap[g.id]).map(g => groupsMap[g.id]);
                    Object.values(groupsMap).forEach(ng => {
                        if(!currentIds.includes(ng.id)) merged.push(ng);
                    });
                    return merged;
                });
                
                setKilosFisicos(currentKilos);
                setCodigosBarras(currentCodigos);
                // eslint-disable-next-line
            }, [orders, filtroFecha]); 

            const generarTicketPDF = (group, granTotal) => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ format: [80, 200] });
                    let y = 10;
                    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.text("TICKET DE COMPRA", 40, y, { align: "center" }); y += 8;
                    doc.setFontSize(8); doc.setFont(undefined, 'normal');
                    doc.text(`Fecha: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`, 5, y); y += 5;
                    doc.text(`Repartidor: ${user.nombre}`, 5, y); y += 5;
                    doc.text(doc.splitTextToSize(`Cliente: ${group.cliente.negocio}`, 70), 5, y); y += 6;
                    doc.line(5, y, 75, y); y += 5;

                    group.items.forEach((item) => {
                        const kg = Number(kilosFisicos[item.id]) || 0;
                        const sub = Number(item.cantidad) * kg * Number(item.precioAsignado);
                        doc.setFont(undefined, 'bold'); doc.text(doc.splitTextToSize(`${item.cantidad}x ${item.producto}`, 70), 5, y); y += 4;
                        doc.setFont(undefined, 'normal'); doc.text(`Kg: ${kg} | $${item.precioAsignado}/Kg | Cod: ${codigosBarras[item.id]||'N/A'}`, 5, y);
                        doc.text(`$${sub.toFixed(2)}`, 75, y, { align: "right" }); y += 6;
                    });

                    doc.line(5, y, 75, y); y += 6;
                    doc.setFont(undefined, 'bold'); doc.text(`TOTAL: $${granTotal.toFixed(2)}`, 75, y, { align: "right" }); y += 8;
                    doc.setFont(undefined, 'normal'); doc.text(`Pago: ${metodosPago[group.id] || group.items[0].metodoPago || 'N/A'}`, 5, y); y += 8;
                    doc.text("¡Gracias por su compra!", 40, y, { align: "center" });
                    doc.save(`Ticket_${group.cliente.negocio}.pdf`);
                } catch (e) { alert("Error al crear PDF"); }
            };

            const cambiarEstadoGrupo = (group, nuevoEstado) => {
                if (nuevoEstado === 'Entregado') {
                    if (group.items.some(i => !kilosFisicos[i.id] || Number(kilosFisicos[i.id]) <= 0)) return showModal({ type: 'alert', message: 'Anota los kilos de todas las cajas.' });
                    if (!metodosPago[group.id] && !group.items[0].metodoPago) return showModal({ type: 'alert', message: 'Selecciona cómo pagó el cliente.' });
                }

                showModal({
                    type: 'prompt', title: `Marcar como ${nuevoEstado}`, message: '¿Agregar alguna nota extra?',
                    onConfirm: async (notaExtra) => {
                        setLoadingId(group.id);
                        const observacionesFinales = (group.observaciones || '') + (notaExtra ? ` | Nota: ${notaExtra}` : '');
                        let allSuccess = true;

                        const promesas = group.items.map(async (item) => {
                            const data = {
                                action: 'actualizarPedido',
                                pedidoId: item.id,
                                estado: nuevoEstado,
                                observaciones: observacionesFinales,
                                kilosPorCaja: nuevoEstado === 'Entregado' ? Number(kilosFisicos[item.id]) : Number(item.kilosPorCaja),
                                metodoPago: nuevoEstado === 'Entregado' ? (metodosPago[group.id] || '') : '',
                                codigoEscaneado: codigosBarras[item.id] || ''
                            };
                            
                            const res = await sendPostRequest(data);
                            if (res.status !== 'success') allSuccess = false;
                            return data;
                        });

                        const resList = await Promise.all(promesas);

                        if(allSuccess){
                            setOrders(prev => prev.map(o => {
                                const mod = resList.find(r => r.pedidoId === o.id);
                                return mod ? { ...o, estado: nuevoEstado, observaciones: observacionesFinales, kilosPorCaja: mod.kilosPorCaja, metodoPago: mod.metodoPago, codigoEscaneado: mod.codigoEscaneado } : o;
                            }));
                        } else showModal({ type: 'alert', message: "Error al actualizar algunas cajas." });
                        setLoadingId(null);
                    }
                });
            };

            const moverPedido = (grupoId, direccion) => {
                const currentIndex = orderedGroups.findIndex(g => g.id === grupoId);
                if(currentIndex === -1) return;
                
                let targetIndex = -1;
                if(direccion === 'up') {
                    for(let i = currentIndex - 1; i >= 0; i--) {
                        if(!['Entregado', 'Reprogramado', 'Cancelado'].includes(orderedGroups[i].estado)) {
                            targetIndex = i;
                            break;
                        }
                    }
                } else {
                    for(let i = currentIndex + 1; i < orderedGroups.length; i++) {
                        if(!['Entregado', 'Reprogramado', 'Cancelado'].includes(orderedGroups[i].estado)) {
                            targetIndex = i;
                            break;
                        }
                    }
                }

                if(targetIndex !== -1) {
                    const nuevos = [...orderedGroups];
                    const temp = nuevos[currentIndex];
                    nuevos[currentIndex] = nuevos[targetIndex];
                    nuevos[targetIndex] = temp;
                    setOrderedGroups(nuevos);
                }
            };

            // Filtrado de las listas según el estado para los Tabs
            const gruposPendientes = orderedGroups.filter(g => !['Entregado', 'Reprogramado', 'Cancelado'].includes(g.estado));
            const gruposCompletados = orderedGroups.filter(g => ['Entregado', 'Reprogramado', 'Cancelado'].includes(g.estado));
            const gruposAMostrar = tabRuta === 'pendientes' ? gruposPendientes : gruposCompletados;

            return (
                <div className="space-y-4 max-w-lg mx-auto pb-20">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 sticky top-[70px] z-10">
                        <div className="flex justify-between items-center">
                            <h2 className="text-lg font-black text-slate-800">Mi Ruta</h2>
                            <input type="date" value={filtroFecha} onChange={e => setFiltroFecha(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm font-bold bg-slate-50" />
                        </div>
                        {/* Selector de Pestañas */}
                        <div className="flex bg-slate-100 p-1 rounded-xl">
                            <button onClick={() => setTabRuta('pendientes')} className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${tabRuta === 'pendientes' ? 'bg-white text-amber-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Pendientes ({gruposPendientes.length})</button>
                            <button onClick={() => setTabRuta('completadas')} className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${tabRuta === 'completadas' ? 'bg-white text-amber-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Realizadas ({gruposCompletados.length})</button>
                        </div>
                    </div>

                    {gruposAMostrar.map((group, index) => {
                        const granTotal = group.items.reduce((sum, item) => sum + (Number(item.cantidad) * (Number(kilosFisicos[item.id])||0) * Number(item.precioAsignado)), 0);

                        return (
                            <div key={group.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
                                <div className="flex items-start justify-between mb-2">
                                    <div className="flex gap-3">
                                        {/* Botones de orden (Solo en pendientes) */}
                                        {tabRuta === 'pendientes' && (
                                            <div className="flex flex-col items-center bg-slate-50 border border-slate-100 rounded-lg p-0.5">
                                                <button onClick={() => moverPedido(group.id, 'up')} className="text-slate-400 hover:text-amber-500 p-1"><Icon name="ArrowUp" size={16}/></button>
                                                <span className="text-xs font-black text-slate-500 px-1">{index + 1}</span>
                                                <button onClick={() => moverPedido(group.id, 'down')} className="text-slate-400 hover:text-amber-500 p-1"><Icon name="ArrowDown" size={16}/></button>
                                            </div>
                                        )}
                                        <div>
                                            <h3 className="font-black text-lg text-slate-800 leading-tight">{group.cliente.negocio}</h3>
                                            <p className="text-xs font-medium text-slate-500 mt-0.5">{group.cliente.telefono}</p>
                                        </div>
                                    </div>
                                    <span className={`text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider ${group.estado === 'Entregado' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`}>{group.estado}</span>
                                </div>
                                
                                <p className="text-sm text-slate-600 mt-2 bg-slate-50 p-2 rounded border border-slate-100">
                                    <strong>Dirección/Ref:</strong> {clientes.find(c => String(c.telefono).trim() === String(group.cliente.telefono).trim())?.['dirección_/_referencias'] || clientes.find(c => String(c.telefono).trim() === String(group.cliente.telefono).trim())?.['direccion_/_referencias'] || 'Sin referencias detalladas.'}
                                </p>
                                
                                <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 mt-4">
                                    <p className="text-xs text-amber-700 font-bold uppercase mb-2">Pesaje y Escaneo</p>
                                    {group.items.map(item => (
                                        <div key={item.id} className="mb-3 border-b border-amber-200/50 pb-2">
                                            <div className="flex justify-between font-bold text-sm">
                                                <span>{item.cantidad}x {item.producto} (${item.precioAsignado}/Kg)</span>
                                                <div className="flex items-center gap-1">
                                                    <input type="number" value={kilosFisicos[item.id] || ""} onChange={(e) => setKilosFisicos({...kilosFisicos, [item.id]: e.target.value})} placeholder="Kg" disabled={group.estado === 'Entregado'} className="w-16 p-1 border border-amber-300 rounded text-center text-sm bg-white" />
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2 mt-2">
                                                <button onClick={() => setScannerActivo(item.id)} disabled={group.estado === 'Entregado'} className="bg-slate-800 text-white p-2 rounded hover:bg-slate-700 disabled:opacity-50"><Icon name="ScanLine" size={16} /></button>
                                                <input type="text" value={codigosBarras[item.id] || ""} onChange={(e) => setCodigosBarras({...codigosBarras, [item.id]: e.target.value})} placeholder="Código de barras..." disabled={group.estado === 'Entregado'} className="flex-1 p-2 text-xs border border-amber-300 rounded outline-none bg-white" />
                                            </div>
                                        </div>
                                    ))}
                                    <p className="font-black text-2xl text-right text-green-700 mt-2">Total: ${granTotal.toFixed(2)}</p>
                                </div>

                                {/* BOTONES DE ACCIÓN: MAPA, WHATSAPP, LLAMAR */}
                                <div className="flex flex-wrap gap-2 mt-4">
                                    <a href={`https://wa.me/52${String(group.cliente.telefono).replace(/\D/g,'')}?text=Hola, soy el repartidor. Voy en camino con su pedido. En un momento le adjunto su ticket.`} target="_blank" className="flex-1 min-w-[90px] bg-green-500 text-white flex justify-center items-center gap-1 py-2.5 rounded-lg font-bold text-sm hover:bg-green-600 shadow-sm transition">
                                        <Icon name="MessageCircle" size={16}/> Whats
                                    </a>
                                    <a href={`tel:${String(group.cliente.telefono).replace(/\D/g,'')}`} className="flex-1 min-w-[90px] bg-blue-500 text-white flex justify-center items-center gap-1 py-2.5 rounded-lg font-bold text-sm hover:bg-blue-600 shadow-sm transition">
                                        <Icon name="Phone" size={16}/> Llamar
                                    </a>
                                    <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(group.cliente.ubicacion)}`} target="_blank" className="flex-1 min-w-[90px] bg-slate-800 text-white flex justify-center items-center gap-1 py-2.5 rounded-lg font-bold text-sm hover:bg-slate-900 shadow-sm transition">
                                        <Icon name="MapPin" size={16}/> Ruta
                                    </a>
                                </div>

                                {group.estado !== 'Entregado' && group.estado !== 'Cancelado' && (
                                    <>
                                        <div className="mt-4">
                                            <select value={metodosPago[group.id] || group.items[0].metodoPago || ""} onChange={(e) => setMetodosPago({...metodosPago, [group.id]: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 outline-none font-medium text-slate-700">
                                                <option value="">Selecciona Método de Pago...</option>
                                                <option value="Efectivo">💵 Efectivo</option>
                                                <option value="Transferencia">📱 Transferencia</option>
                                                <option value="Credito">💳 Crédito</option>
                                                <option value="Parcialidades">⏱️ Parcialidades</option>
                                                <option value="Otro">📝 Otro</option>
                                            </select>
                                        </div>
                                        <button onClick={() => generarTicketPDF(group, granTotal)} className="w-full mt-2 bg-red-50 text-red-600 py-2.5 rounded-lg font-bold border border-red-200 text-sm flex justify-center items-center gap-2 hover:bg-red-100 transition"><Icon name="FileText" size={18} /> Descargar Ticket PDF</button>
                                        
                                        <div className="flex gap-2 mt-4 pt-4 border-t border-slate-100">
                                            <button onClick={() => cambiarEstadoGrupo(group, 'Entregado')} disabled={loadingId === group.id} className="flex-1 bg-emerald-100 text-emerald-800 py-3 rounded-lg font-bold text-sm flex justify-center items-center gap-2">
                                                {loadingId === group.id ? <Icon name="Loader" size={18}/> : <Icon name="CheckCircle" size={18}/>} Entregado
                                            </button>
                                            <button onClick={() => cambiarEstadoGrupo(group, 'Reprogramado')} disabled={loadingId === group.id} className="flex-1 bg-orange-100 text-orange-800 py-3 rounded-lg font-bold text-sm">
                                                Reprogramar
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        );
                    })}
                    
                    {gruposAMostrar.length === 0 && (
                        <div className="text-center p-10 bg-slate-100 border-2 border-dashed border-slate-300 rounded-3xl text-slate-500 mt-4">
                            <Icon name="CheckCircle" size={48} className="mx-auto mb-4 text-slate-400 opacity-50" />
                            <p className="font-medium text-lg">Todo listo</p>
                            <p className="text-sm mt-1">No hay entregas {tabRuta === 'pendientes' ? 'pendientes' : 'realizadas'} para esta fecha.</p>
                        </div>
                    )}
                    
                    {scannerActivo && <ScannerModal onScan={(text) => { setCodigosBarras({...codigosBarras, [scannerActivo]: text}); setScannerActivo(null); }} onClose={() => setScannerActivo(null)} />}
                </div>
            );
        };

        const App = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [users, setUsers] = useState([]);
            const [orders, setOrders] = useState([]);
            const [clientes, setClientes] = useState([]);
            const [productos, setProductos] = useState([]);
            const [isLoadingApp, setIsLoadingApp] = useState(true);
            const [error, setError] = useState(null);
            const [modalConfig, setModalConfig] = useState(null);

            const [loginForm, setLoginForm] = useState({ usuario: '', password: '' });
            const [loginError, setLoginError] = useState("");

            useEffect(() => {
                const fetchAllData = async () => {
                    try {
                        const urls = [
                            `${SCRIPT_URL}?action=getUsuarios`,
                            `${SCRIPT_URL}?action=getProductos`,
                            `${SCRIPT_URL}?action=getVentas`,
                            `${SCRIPT_URL}?action=getClientes`
                        ];
                        
                        // Modificamos fetch para detectar errores no-JSON (Ej. HTML de Google Login)
                        const responses = await Promise.all(urls.map(async url => {
                            const req = await fetch(url);
                            const text = await req.text();
                            try {
                                return JSON.parse(text);
                            } catch (e) {
                                console.error("Respuesta fallida de Google:", text);
                                throw new Error("Permisos denegados en Apps Script. Revisa que esté publicado para 'Cualquier persona'.");
                            }
                        }));

                        const [resUsuarios, resProductos, resVentas, resClientes] = responses;

                        // Manejo de errores devueltos por el propio Apps Script (ej. hoja no encontrada)
                        if(resUsuarios.status === 'error') throw new Error(`Hoja Usuarios: ${resUsuarios.data}`);
                        if(resProductos.status === 'error') throw new Error(`Hoja Productos: ${resProductos.data}`);
                        if(resVentas.status === 'error') throw new Error(`Hoja Ventas: ${resVentas.data}`);
                        if(resClientes.status === 'error') throw new Error(`Hoja Clientes: ${resClientes.data}`);

                        setUsers(resUsuarios.data);
                        setProductos(resProductos.data);
                        setClientes(resClientes.data);
                        
                        setOrders(resVentas.data.map(v => ({
                            id: v.id_pedido || v.id, vendedorId: v.vendedor_id || v.vendedor,
                            cliente: { telefono: v.telefono || v.teléfono, negocio: v.negocio, ubicacion: v.ubicacion || v.ubicación },
                            producto: v.producto, cantidad: v.cantidad, fechaEntrega: v.fecha_entrega ? v.fecha_entrega.toString().split('T')[0] : "",
                            observaciones: v.observaciones, estado: v.estado || 'Pendiente', repartidorId: v.repartidor_id || v.repartidor,
                            precioAsignado: Number(v.precio) || 0, kilosPorCaja: Number(v.kilos) || 0,
                            metodoPago: v.forma_de_pago || v.pago || v.metodo_pago || '', 
                            codigoEscaneado: v.codigo_barras || v.codigo || v.codigo_escaneado || ''
                        })));
                        
                    } catch (err) { 
                        setError(err.message || "Error general de conexión."); 
                    } finally { 
                        setIsLoadingApp(false); 
                    }
                };
                fetchAllData();
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const matchedUser = users.find(u => u.usuario === loginForm.usuario && String(u.password) === String(loginForm.password));
                if (matchedUser) {
                    setCurrentUser(matchedUser);
                    setLoginError("");
                } else {
                    setLoginError("Usuario o contraseña incorrectos.");
                }
            };

            if (isLoadingApp) return <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50"><Icon name="Loader" size={48} className="text-amber-500 animate-spin mb-4"/><p className="font-bold text-slate-600">Cargando sistema...</p></div>;
            
            // Pantalla de error mejorada
            if (error) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
                    <div className="bg-red-50 border border-red-200 p-8 rounded-2xl w-full max-w-md text-center shadow-lg">
                        <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Icon name="Trash2" size={32} />
                        </div>
                        <h2 className="text-xl font-black text-red-700 mb-2">Error de conexión</h2>
                        <p className="text-sm font-medium text-red-800 bg-red-100/50 p-3 rounded-lg mb-4">{error}</p>
                        <p className="text-xs text-red-600 text-left">
                            <strong>Posibles soluciones:</strong><br/>
                            1. Asegúrate de que Apps Script esté publicado para <b>"Cualquier persona"</b>.<br/>
                            2. Verifica que las pestañas en Excel se llamen exactamente: <b>Usuarios</b>, <b>Productos</b> y <b>Ventas a entregar</b>.
                        </p>
                    </div>
                </div>
            );

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                        <form onSubmit={handleLogin} className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="User" size={32} /></div>
                            <h1 className="text-2xl font-black text-center text-slate-800 mb-6">Acceso al Sistema</h1>
                            
                            {loginError && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 text-center font-medium border border-red-200">{loginError}</div>}
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-slate-600 mb-1">Usuario</label>
                                    <input type="text" required value={loginForm.usuario} onChange={e => setLoginForm({...loginForm, usuario: e.target.value})} className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500" placeholder="Ingresa tu usuario" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-600 mb-1">Contraseña</label>
                                    <input type="password" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500" placeholder="••••••••" />
                                </div>
                                <button type="submit" className="w-full bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700 transition shadow-md mt-2">Iniciar Sesión</button>
                            </div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-100/50">
                    <header className="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold text-amber-400">ControlHuevos<span className="text-white">Pro</span></h1>
                            <button onClick={() => setCurrentUser(null)} className="p-2 hover:bg-slate-800 rounded-full"><Icon name="LogOut" size={20} /></button>
                        </div>
                    </header>
                    <main className="flex-1 w-full max-w-6xl mx-auto p-4 md:p-6 mt-2">
                        {(currentUser.rol||'').toLowerCase() === 'vendedor' && <VendedorView user={currentUser} setOrders={setOrders} clientes={clientes} productos={productos} showModal={setModalConfig} />}
                        {(currentUser.rol||'').toLowerCase() === 'admin' && <AdminView orders={orders} setOrders={setOrders} users={users} setUsers={setUsers} showModal={setModalConfig} />}
                        {(currentUser.rol||'').toLowerCase() === 'repartidor' && <RepartidorView user={currentUser} orders={orders} setOrders={setOrders} clientes={clientes} showModal={setModalConfig} />}
                    </main>
                    <CustomModal config={modalConfig} onClose={() => setModalConfig(null)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
