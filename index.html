<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ventas - Cajas de Huevo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- NUEVAS LIBRERÍAS PARA CÓDIGO DE BARRAS Y PDF -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        html, body { height: 100%; margin: 0; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgF1W6GhcPPm0TTUcIq7r2JP5qufXizBPkKPgqpgIGVI6qQmKjPQ_0j2yR_qVT4KglRw/exec";

        const sendPostRequest = async (data) => {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error("Error en POST:", error);
                return { status: 'error', message: error.message };
            }
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                User: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                MapPin: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
                Phone: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
                MessageCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
                LogOut: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
                Save: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
                Loader: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className} animate-spin"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>`,
                Trash2: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
                Plus: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
                ArrowUp: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m18 15-6-6-6 6"/></svg>`,
                CheckCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
                ScanLine: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" x2="17" y1="12" y2="12"/></svg>`,
                FileText: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`
            };
            return <span dangerouslySetInnerHTML={{ __html: icons[name] || '' }} />;
        };

        const CustomModal = ({ config, onClose }) => {
            if (!config) return null;
            const { type, title, message, onConfirm, defaultValue = '' } = config;
            const [inputValue, setInputValue] = useState(defaultValue);

            const handleConfirm = () => {
                if (type === 'prompt') {
                    onConfirm(inputValue);
                } else if (onConfirm) {
                    onConfirm();
                }
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
                        <div className="p-5">
                            <h3 className="text-lg font-bold text-slate-800 mb-2">{title || 'Atención'}</h3>
                            <p className="text-sm text-slate-600 mb-4">{message}</p>
                            
                            {type === 'prompt' && (
                                <input 
                                    type="text" 
                                    value={inputValue} 
                                    onChange={(e) => setInputValue(e.target.value)}
                                    className="w-full p-2 border border-slate-300 rounded-lg mb-4 outline-none focus:ring-2 focus:ring-amber-500"
                                    placeholder="Escribe aquí..."
                                    autoFocus
                                />
                            )}

                            <div className="flex gap-3 justify-end mt-2">
                                {type === 'prompt' && (
                                    <button onClick={onClose} className="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">
                                        Cancelar
                                    </button>
                                )}
                                <button onClick={handleConfirm} className="px-4 py-2 text-sm font-medium text-white bg-amber-600 hover:bg-amber-700 rounded-lg transition shadow-sm">
                                    Aceptar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Función para calcular subtotal (Cajas * Kilos * Precio/Kg)
        const calcItemTotal = (item) => {
            const kg = Number(item.kilosPorCaja) || 0;
            const precio = Number(item.precioAsignado) || 0;
            const cant = Number(item.cantidad) || 0;
            return cant * kg * precio;
        };

        // Componente del Escáner de Código de Barras
        const ScannerModal = ({ onScan, onClose }) => {
            useEffect(() => {
                const html5QrcodeScanner = new Html5QrcodeScanner(
                    "qr-reader",
                    { fps: 10, qrbox: { width: 250, height: 100 } },
                    false
                );
                html5QrcodeScanner.render((decodedText) => {
                    html5QrcodeScanner.clear();
                    onScan(decodedText);
                }, () => {});

                return () => {
                    try { html5QrcodeScanner.clear(); } catch(e){}
                };
            }, []);

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                    <div className="bg-white p-5 rounded-2xl w-full max-w-sm shadow-xl">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="ScanLine" /> Escanear Código</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-red-500 bg-slate-100 p-2 rounded-full"><Icon name="Trash2" size={16}/></button>
                        </div>
                        <div id="qr-reader" className="w-full overflow-hidden rounded-lg border-2 border-amber-200"></div>
                        <button onClick={onClose} className="mt-4 w-full bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200 transition">Cancelar Escaneo</button>
                    </div>
                </div>
            );
        };

        const VendedorView = ({ user, setOrders, clientes, productos, showModal }) => {
            const [telefono, setTelefono] = useState("");
            const [cliente, setCliente] = useState(null);
            
            const [fecha, setFecha] = useState("");
            const [observaciones, setObservaciones] = useState("");
            // El vendedor define el precioAsignado desde la creación
            const [lineas, setLineas] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (productos && productos.length > 0 && lineas.length === 0) {
                    setLineas([{ id: Date.now(), productoId: productos[0].id || productos[0].nombre, cantidad: 1, precioAsignado: "" }]);
                }
            }, [productos, lineas.length]);

            const buscarCliente = () => {
                const encontrado = clientes.find(c => {
                    const telDb = String(c.telefono || c.teléfono || "").trim();
                    return telDb === telefono.trim();
                });
                setCliente(encontrado || { noEncontrado: true });
            };

            const agregarLinea = () => {
                const defaultProd = productos.length > 0 ? (productos[0].id || productos[0].nombre) : "";
                setLineas([...lineas, { id: Date.now(), productoId: defaultProd, cantidad: 1, precioAsignado: "" }]);
            };

            const removerLinea = (idToRemove) => {
                setLineas(lineas.filter(l => l.id !== idToRemove));
            };

            const actualizarLinea = (id, campo, valor) => {
                setLineas(lineas.map(l => l.id === id ? { ...l, [campo]: valor } : l));
            };

            const guardarPedido = async (e) => {
                e.preventDefault();
                if (lineas.length === 0) return showModal({ type: 'alert', message: "Agrega al menos un producto." });
                setLoading(true);

                const baseId = Date.now().toString().slice(-6);
                let successCount = 0;
                const nuevosPedidos = [];

                for (let i = 0; i < lineas.length; i++) {
                    const linea = lineas[i];
                    const prodSeleccionado = productos.find(p => (p.id || p.nombre) === linea.productoId);
                    const nombreProducto = prodSeleccionado ? (prodSeleccionado.nombre || prodSeleccionado.producto) : linea.productoId;

                    const nuevoPedido = {
                        id: lineas.length > 1 ? `PED-${baseId}-${i+1}` : `PED-${baseId}`,
                        vendedorId: user.id || user.nombre,
                        cliente: {
                            telefono: cliente.telefono || cliente.teléfono,
                            negocio: cliente.negocio,
                            ubicacion: cliente.ubicacion || cliente.ubicación
                        },
                        producto: nombreProducto,
                        cantidad: linea.cantidad,
                        fechaEntrega: fecha,
                        observaciones: observaciones,
                        precioAsignado: parseFloat(linea.precioAsignado) || 0 // El vendedor define el precio aquí
                    };

                    const res = await sendPostRequest({ action: 'nuevoPedido', pedido: nuevoPedido });

                    if (res.status === 'success') {
                        successCount++;
                        nuevosPedidos.push({ ...nuevoPedido, estado: 'Pendiente', kilosPorCaja: 0 });
                    }
                }

                if (successCount === lineas.length) {
                    setOrders(prev => [...prev, ...nuevosPedidos]);
                    showModal({ type: 'alert', title: '¡Éxito!', message: "Pedido guardado con éxito." });
                    setTelefono(""); setCliente(null); setFecha(""); setObservaciones("");
                    const defaultProd = productos.length > 0 ? (productos[0].id || productos[0].nombre) : "";
                    setLineas([{ id: Date.now(), productoId: defaultProd, cantidad: 1, precioAsignado: "" }]);
                } else if (successCount > 0) {
                    setOrders(prev => [...prev, ...nuevosPedidos]);
                    showModal({ type: 'alert', message: `Se guardaron ${successCount} de ${lineas.length} productos. Hubo un error de red.` });
                } else {
                    showModal({ type: 'alert', title: 'Error', message: "Error al guardar. Verifica tu conexión." });
                }
                setLoading(false);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <h2 className="text-2xl font-bold text-amber-600">Nuevo Pedido</h2>
                    
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <label className="block text-sm font-medium text-slate-700 mb-2">Teléfono del Cliente</label>
                        <div className="flex flex-col sm:flex-row gap-2">
                            <input type="text" value={telefono} onChange={e => setTelefono(e.target.value)} placeholder="Ej. 5551234567" className="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" />
                            <button onClick={buscarCliente} className="bg-amber-500 text-white px-6 py-3 rounded-xl font-medium hover:bg-amber-600 transition flex items-center justify-center gap-2">
                                Buscar
                            </button>
                        </div>

                        {cliente && !cliente.noEncontrado && (
                            <div className="mt-4 p-4 bg-slate-50 rounded-xl border border-slate-100 text-sm shadow-inner">
                                <p><strong>Nombre del negocio:</strong> {cliente.negocio}</p>
                                <p><strong>Giro:</strong> {cliente.giro}</p>
                                <p><strong>Encargado:</strong> {cliente.encargado}</p>
                                <div className="mt-2 p-2 bg-slate-100 rounded text-slate-700 border border-slate-200">
                                    <strong>Dirección:</strong> 
                                    <span className="italic block mt-1">{cliente['dirección_/_referencias'] || cliente['direccion_/_referencias'] || cliente.referencias || cliente.direccion || "Sin referencias detalladas."}</span>
                                </div>
                                <p className="flex items-center gap-1 mt-3">
                                    <strong>Ubicación Maps:</strong> {cliente.ubicacion || cliente.ubicación} 
                                    <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cliente.ubicacion || cliente.ubicación)}`} target="_blank" className="text-blue-500 flex items-center gap-1 ml-2 hover:underline bg-blue-50 px-2 py-1 rounded-md">
                                        <Icon name="MapPin" size={14} /> Abrir
                                    </a>
                                </p>
                            </div>
                        )}
                        {cliente?.noEncontrado && <p className="text-red-500 text-sm mt-3 font-medium flex items-center gap-1">Cliente no encontrado en la base de datos.</p>}
                    </div>

                    {cliente && !cliente.noEncontrado && (
                        <form onSubmit={guardarPedido} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                            <h3 className="font-semibold text-lg border-b pb-3 text-slate-800">Detalles del Pedido y Cotización</h3>
                            
                            <div className="space-y-3">
                                <label className="block text-sm font-medium text-slate-700">Productos a surtir</label>
                                {lineas.map((linea) => (
                                    <div key={linea.id} className="flex gap-2 items-center bg-slate-50 p-2 rounded-xl border border-slate-100 flex-wrap sm:flex-nowrap">
                                        <div className="flex-1 min-w-[150px]">
                                            <select value={linea.productoId} onChange={e => actualizarLinea(linea.id, 'productoId', e.target.value)} className="w-full p-2 border-none bg-transparent outline-none text-sm font-medium text-slate-700">
                                                {productos.map(p => <option key={p.id || p.nombre} value={p.id || p.nombre}>{p.nombre || p.producto}</option>)}
                                            </select>
                                        </div>
                                        <div className="w-20">
                                            <input type="number" min="1" value={linea.cantidad} onChange={e => actualizarLinea(linea.id, 'cantidad', e.target.value)} className="w-full p-2 border border-slate-200 rounded-lg outline-none text-center text-sm" required placeholder="Cajas" title="Cantidad de Cajas" />
                                        </div>
                                        <div className="w-24 relative">
                                            <span className="absolute left-2 top-2.5 text-slate-400 text-sm">$</span>
                                            <input type="number" step="0.01" value={linea.precioAsignado} onChange={e => actualizarLinea(linea.id, 'precioAsignado', e.target.value)} className="w-full p-2 pl-6 border border-slate-200 rounded-lg outline-none text-sm" required placeholder="Precio/Kg" title="Precio por Kilo" />
                                        </div>
                                        {lineas.length > 1 && (
                                            <button type="button" onClick={() => removerLinea(linea.id)} className="p-2 text-red-500 hover:bg-red-100 rounded-lg transition" title="Quitar">
                                                <Icon name="Trash2" size={18} />
                                            </button>
                                        )}
                                    </div>
                                ))}
                                <button type="button" onClick={agregarLinea} className="text-sm font-semibold text-amber-600 hover:text-amber-700 flex items-center gap-1 mt-2 p-2 hover:bg-amber-50 rounded-lg transition w-max">
                                    <Icon name="Plus" size={16} /> Añadir otra variedad
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-100">
                                <div>
                                    <label className="block text-sm font-medium mb-1 text-slate-700">Fecha de Entrega</label>
                                    <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500" required />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium mb-1 text-slate-700">Observaciones (Horario, sugerencias)</label>
                                    <textarea value={observaciones} onChange={e => setObservaciones(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500" rows="2" placeholder="Ej. Entregar después de las 2 PM..."></textarea>
                                </div>
                            </div>
                            
                            <button type="submit" disabled={loading} className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition flex justify-center items-center gap-2 disabled:opacity-70 mt-6 shadow-md">
                                {loading ? <Icon name="Loader" /> : <Icon name="Save" />}
                                {loading ? 'Guardando...' : 'Confirmar y Enviar Pedido'}
                            </button>
                        </form>
                    )}
                </div>
            );
        };

        const AdminView = ({ orders, setOrders, users, clientes, showModal }) => {
            const [tab, setTab] = useState('pedidos');
            const [loadingId, setLoadingId] = useState(null);

            const hoy = new Date().toISOString().split('T')[0];

            const [filtroFechaPedidos, setFiltroFechaPedidos] = useState(hoy);
            const [dashRangoInicio, setDashRangoInicio] = useState('');
            const [dashRangoFin, setDashRangoFin] = useState('');
            const [dashRepartidor, setDashRepartidor] = useState('');

            // El administrador solo edita Fecha y Repartidor
            const [editState, setEditState] = useState({});

            const groupedOrders = useMemo(() => {
                let list = [...orders];
                if (filtroFechaPedidos && tab === 'pedidos') {
                    list = list.filter(o => o.fechaEntrega === filtroFechaPedidos);
                }
                list.sort((a, b) => new Date(a.fechaEntrega) - new Date(b.fechaEntrega));

                const groupsMap = {};
                list.forEach(o => {
                    const key = `${o.cliente.telefono}-${o.fechaEntrega}`;
                    if (!groupsMap[key]) {
                        groupsMap[key] = {
                            id: key,
                            cliente: o.cliente,
                            fechaEntrega: o.fechaEntrega,
                            estado: o.estado,
                            repartidorId: o.repartidorId,
                            observaciones: o.observaciones,
                            items: []
                        };
                    }
                    groupsMap[key].items.push(o);
                });
                return Object.values(groupsMap);
            }, [orders, filtroFechaPedidos, tab]);

            useEffect(() => {
                const state = {};
                groupedOrders.forEach(group => {
                    state[group.id] = { 
                        repartidorId: group.repartidorId || "", 
                        fechaEntrega: group.fechaEntrega || ""
                    };
                });
                setEditState(state);
            }, [groupedOrders, orders]);

            const handleGroupEdit = (groupId, field, value) => {
                setEditState(prev => ({ ...prev, [groupId]: { ...prev[groupId], [field]: value } }));
            };

            const guardarCambiosGrupo = async (group) => {
                setLoadingId(group.id);
                const cambiosGrupo = editState[group.id];
                
                let allSuccess = true;
                const promesas = group.items.map(async (item) => {
                    const dataToSave = {
                        action: 'actualizarPedido',
                        pedidoId: item.id,
                        repartidorId: cambiosGrupo.repartidorId,
                        fechaEntrega: cambiosGrupo.fechaEntrega,
                        estado: cambiosGrupo.repartidorId ? (item.estado === 'Pendiente' ? 'Asignado' : item.estado) : 'Pendiente'
                        // No tocamos precio ni kilos aquí, conservamos lo de la base de datos
                    };
                    const res = await sendPostRequest(dataToSave);
                    if (res.status !== 'success') {
                        allSuccess = false;
                        showModal({ type: 'alert', title: "Error", message: `Fallo en ${item.producto}: ${res.message}` });
                    }
                    return { item, dataToSave, res };
                });

                const resultados = await Promise.all(promesas);

                if (allSuccess) {
                    setOrders(prev => prev.map(o => {
                        const target = resultados.find(r => r.item.id === o.id);
                        if (target) {
                            return {
                                ...o,
                                repartidorId: target.dataToSave.repartidorId,
                                fechaEntrega: target.dataToSave.fechaEntrega,
                                estado: target.dataToSave.estado
                            };
                        }
                        return o;
                    }));
                    showModal({ type: 'alert', message: "Asignación actualizada correctamente." });
                }
                setLoadingId(null);
            };

            const repartidores = users.filter(u => u.rol && u.rol.toLowerCase() === 'repartidor');

            const pedidosDash = orders.filter(o => {
                let pasa = true;
                if (dashRangoInicio) pasa = pasa && o.fechaEntrega >= dashRangoInicio;
                if (dashRangoFin) pasa = pasa && o.fechaEntrega <= dashRangoFin;
                if (dashRepartidor) pasa = pasa && o.repartidorId === dashRepartidor;
                return pasa;
            });

            return (
                <div className="space-y-6">
                    <div className="flex space-x-1 border-b border-slate-200 overflow-x-auto pb-1">
                        {['pedidos', 'usuarios', 'dashboard'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-5 py-3 font-medium capitalize rounded-t-lg transition whitespace-nowrap ${tab === t ? 'text-amber-700 bg-amber-50 border-b-2 border-amber-600' : 'text-slate-500 hover:text-amber-600 hover:bg-slate-50'}`}>
                                {t}
                            </button>
                        ))}
                    </div>

                    {tab === 'pedidos' && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <span className="font-semibold text-slate-700 flex items-center gap-2"><Icon name="CalendarDays" size={20}/> Fecha de Entrega:</span>
                                    <input type="date" value={filtroFechaPedidos} onChange={e => setFiltroFechaPedidos(e.target.value)} className="p-2 border border-slate-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-amber-500" />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setFiltroFechaPedidos('')} className="text-sm px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 transition">Ver Todos</button>
                                    <button onClick={() => setFiltroFechaPedidos(hoy)} className="text-sm px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 font-medium hover:bg-amber-200 transition">Ver Hoy</button>
                                </div>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                                        <tr>
                                            <th className="p-4">Cliente / Contacto</th>
                                            <th className="p-4">Productos (Solo visualización)</th>
                                            <th className="p-4">Asignación de Ruta</th>
                                            <th className="p-4 text-center">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {groupedOrders.map(group => (
                                            <tr key={group.id} className="hover:bg-slate-50/80 transition align-top group-row">
                                                <td className="p-4 min-w-[200px]">
                                                    <div className="font-bold text-slate-800 text-base">{group.cliente.negocio}</div>
                                                    <div className="text-xs text-slate-500 mt-1" title={group.cliente.ubicacion}>{group.cliente.ubicacion}</div>
                                                    <div className="mt-2 flex items-center gap-2">
                                                        <span className="text-xs font-medium bg-slate-100 px-2 py-1 rounded">{group.cliente.telefono}</span>
                                                        <a href={`https://wa.me/52${group.cliente.telefono}?text=Hola,%20nos%20comunicamos%20para%20confirmar%20su%20pedido%20de%20huevo.`} target="_blank" className="text-green-600 hover:text-green-700 bg-green-50 p-1 rounded-full" title="Confirmar cita por WhatsApp">
                                                            <Icon name="MessageCircle" size={16} />
                                                        </a>
                                                    </div>
                                                    <span className={`inline-block mt-3 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase ${group.estado === 'Entregado' ? 'bg-green-100 text-green-700' : group.estado === 'Asignado' ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                        {group.estado}
                                                    </span>
                                                </td>
                                                
                                                <td className="p-4">
                                                    <div className="space-y-3">
                                                        {group.items.map(item => (
                                                            <div key={item.id} className="bg-slate-50 border border-slate-200 p-2.5 rounded-lg flex flex-col gap-1">
                                                                <div className="font-semibold text-slate-700">
                                                                    <span className="text-amber-600">{item.cantidad}x</span> {item.producto}
                                                                </div>
                                                                <div className="text-xs text-slate-500 font-medium bg-white px-2 py-1 rounded border border-slate-100 inline-block w-max">
                                                                    Precio asignado: <span className="text-slate-800">${item.precioAsignado}/Kg</span> | Kilos físicos: <span className="text-slate-800">{item.kilosPorCaja > 0 ? `${item.kilosPorCaja} Kg` : 'Pendiente (Repartidor)'}</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        {group.observaciones && <div className="text-xs text-amber-700 italic mt-2 bg-amber-50 p-2 rounded">Notas: "{group.observaciones}"</div>}
                                                    </div>
                                                </td>

                                                <td className="p-4 space-y-4 border-l border-slate-50">
                                                    {editState[group.id] && (
                                                        <>
                                                            <div>
                                                                <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Cambiar Fecha</label>
                                                                <input type="date" value={editState[group.id].fechaEntrega} onChange={(e) => handleGroupEdit(group.id, 'fechaEntrega', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-500 bg-white" />
                                                            </div>
                                                            <div>
                                                                <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Asignar Repartidor</label>
                                                                <select value={editState[group.id].repartidorId} onChange={(e) => handleGroupEdit(group.id, 'repartidorId', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                                                                    <option value="">Sin asignar</option>
                                                                    {repartidores.map(r => <option key={r.id || r.nombre} value={r.id || r.nombre}>{r.nombre}</option>)}
                                                                </select>
                                                            </div>
                                                        </>
                                                    )}
                                                </td>

                                                <td className="p-4 text-center align-middle">
                                                    <button onClick={() => guardarCambiosGrupo(group)} disabled={loadingId === group.id || group.estado === 'Entregado'} className="bg-amber-500 text-white p-3 rounded-xl hover:bg-amber-600 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed mx-auto block" title="Guardar Cambios de Todo el Pedido">
                                                        {loadingId === group.id ? <Icon name="Loader" size={20} /> : <Icon name="Save" size={20} />}
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                        {groupedOrders.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-slate-500 font-medium">No hay pedidos registrados para los filtros seleccionados</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {tab === 'usuarios' && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-2xl">
                            <h3 className="font-semibold mb-4 text-lg text-slate-800 border-b pb-2">Directorio de Usuarios</h3>
                            <ul className="divide-y divide-slate-100">
                                {users.map((u, i) => (
                                    <li key={i} className="py-4 flex justify-between items-center hover:bg-slate-50 px-2 rounded-lg transition">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500">
                                                <Icon name="User" size={20} />
                                            </div>
                                            <div>
                                                <p className="font-bold text-slate-800">{u.nombre}</p>
                                                <p className="text-xs text-slate-500 font-mono">ID/Usuario: {u.username || u.usuario || 'N/A'}</p>
                                            </div>
                                        </div>
                                        <span className={`px-3 py-1 rounded-full text-[10px] uppercase font-bold tracking-wider ${(u.rol||'').toLowerCase() === 'admin' ? 'bg-purple-100 text-purple-700' : (u.rol||'').toLowerCase() === 'vendedor' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                            {u.rol || 'Sin Rol'}
                                        </span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {tab === 'dashboard' && (
                        <div className="space-y-6">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-5">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Desde Fecha</label>
                                    <input type="date" value={dashRangoInicio} onChange={e => setDashRangoInicio(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-amber-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Hasta Fecha</label>
                                    <input type="date" value={dashRangoFin} onChange={e => setDashRangoFin(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-amber-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Repartidor</label>
                                    <select value={dashRepartidor} onChange={e => setDashRepartidor(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-amber-500">
                                        <option value="">Todos los repartidores</option>
                                        {repartidores.map(r => <option key={r.id || r.nombre} value={r.id || r.nombre}>{r.nombre}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden group">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-slate-400"></div>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Total Entregas</p>
                                    <p className="text-4xl font-black text-slate-800">{new Set(pedidosDash.map(o => o.cliente.telefono + o.fechaEntrega)).size}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden group">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Cajas Vendidas</p>
                                    <p className="text-4xl font-black text-slate-800">{pedidosDash.reduce((sum, o) => sum + Number(o.cantidad), 0)}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden group">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Kilos Reales Físicos</p>
                                    <p className="text-4xl font-black text-slate-800">{pedidosDash.reduce((sum, o) => sum + (Number(o.cantidad) * Number(o.kilosPorCaja || 0)), 0)}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden group">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Ingresos</p>
                                    <p className="text-4xl font-black text-blue-600">
                                        ${pedidosDash.filter(o => o.estado === 'Entregado').reduce((acc, curr) => acc + calcItemTotal(curr), 0).toFixed(2)}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const RepartidorView = ({ user, orders, setOrders, clientes, showModal }) => {
            const [loadingId, setLoadingId] = useState(null);
            const hoy = new Date().toISOString().split('T')[0];
            const [filtroFecha, setFiltroFecha] = useState(hoy);
            
            const [orderedGroups, setOrderedGroups] = useState([]);
            
            const [kilosFisicos, setKilosFisicos] = useState({});
            const [metodosPago, setMetodosPago] = useState({});
            
            // Estados para el Escáner
            const [codigosBarras, setCodigosBarras] = useState({});
            const [scannerActivo, setScannerActivo] = useState(null); // Guarda el ID del item a escanear

            useEffect(() => {
                const filtrados = orders.filter(o => o.repartidorId === (user.id || user.nombre) && o.fechaEntrega === filtroFecha);
                
                const groupsMap = {};
                const currentKilos = { ...kilosFisicos };

                filtrados.forEach(o => {
                    const key = `${o.cliente.telefono}`;
                    if (!groupsMap[key]) {
                        groupsMap[key] = {
                            id: key,
                            cliente: o.cliente,
                            estado: o.estado,
                            observaciones: o.observaciones,
                            items: []
                        };
                    }
                    groupsMap[key].items.push(o);
                    // Llenar el estado local con los kilos de la base de datos si existen
                    if(currentKilos[o.id] === undefined) {
                        currentKilos[o.id] = o.kilosPorCaja || "";
                    }
                });
                
                setOrderedGroups(Object.values(groupsMap));
                setKilosFisicos(currentKilos);
            }, [orders, filtroFecha, user.id, user.nombre]);

            const handleKilosChange = (itemId, val) => {
                setKilosFisicos(prev => ({ ...prev, [itemId]: val }));
            };

            const handleMetodoPagoChange = (groupId, val) => {
                setMetodosPago(prev => ({ ...prev, [groupId]: val }));
            };

            const handleCodigoBarrasChange = (itemId, val) => {
                setCodigosBarras(prev => ({ ...prev, [itemId]: val }));
            };

            // Función para generar Ticket PDF
            const generarTicketPDF = (group, granTotal, totalCajas) => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ format: [80, 200] }); // Formato tipo ticket de impresora térmica
                    
                    let y = 10;
                    doc.setFontSize(12);
                    doc.setFont(undefined, 'bold');
                    doc.text("CONTROL HUEVOS PRO", 40, y, { align: "center" });
                    y += 6;
                    
                    doc.setFontSize(10);
                    doc.setFont(undefined, 'normal');
                    doc.text("TICKET DE VENTA", 40, y, { align: "center" });
                    y += 8;

                    doc.setFontSize(8);
                    doc.text(`Fecha: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`, 5, y);
                    y += 5;
                    doc.text(`Repartidor: ${user.nombre}`, 5, y);
                    y += 5;
                    
                    const splitCliente = doc.splitTextToSize(`Cliente: ${group.cliente.negocio}`, 70);
                    doc.text(splitCliente, 5, y);
                    y += (splitCliente.length * 4) + 2;

                    doc.line(5, y, 75, y);
                    y += 5;

                    group.items.forEach((item) => {
                        const kg = Number(kilosFisicos[item.id]) || 0;
                        const precio = Number(item.precioAsignado) || 0;
                        const cant = Number(item.cantidad) || 0;
                        const subtotal = cant * kg * precio;
                        const codigo = codigosBarras[item.id] || 'Sin código';

                        doc.setFont(undefined, 'bold');
                        const splitProd = doc.splitTextToSize(`${cant}x ${item.producto}`, 70);
                        doc.text(splitProd, 5, y);
                        y += (splitProd.length * 4);
                        
                        doc.setFont(undefined, 'normal');
                        doc.text(`Peso: ${kg} kg | $${precio}/kg`, 5, y);
                        y += 4;
                        doc.text(`Cód: ${codigo}`, 5, y);
                        doc.text(`$${subtotal.toFixed(2)}`, 75, y, { align: "right" });
                        y += 6;
                    });

                    doc.line(5, y, 75, y);
                    y += 6;
                    
                    doc.setFontSize(10);
                    doc.setFont(undefined, 'bold');
                    doc.text(`TOTAL: $${granTotal.toFixed(2)}`, 75, y, { align: "right" });
                    y += 6;

                    doc.setFontSize(8);
                    doc.setFont(undefined, 'normal');
                    doc.text(`Pago: ${metodosPago[group.id] || 'Efectivo'}`, 5, y);
                    y += 8;

                    doc.text("¡Gracias por su preferencia!", 40, y, { align: "center" });
                    
                    doc.save(`Ticket_${group.cliente.telefono}.pdf`);
                } catch (e) {
                    alert("Error al generar PDF. Verifique su conexión.");
                    console.error(e);
                }
            };

            const cambiarEstadoGrupo = (group, nuevoEstado) => {
                // Validación para obligar a meter los kilos si es Entregado
                if (nuevoEstado === 'Entregado') {
                    const faltanKilos = group.items.some(i => !kilosFisicos[i.id] || Number(kilosFisicos[i.id]) <= 0);
                    if (faltanKilos) {
                        return showModal({ type: 'alert', title: 'Faltan Kilos', message: 'Anota los kilos de todas las cajas antes de marcar como Entregado.' });
                    }
                    if (!metodosPago[group.id]) {
                        return showModal({ type: 'alert', title: 'Falta Método de Pago', message: 'Selecciona cómo pagó el cliente antes de entregar.' });
                    }
                }

                showModal({
                    type: 'prompt',
                    title: `Marcar pedido como ${nuevoEstado}`,
                    message: '¿Agregar alguna nota sobre la entrega?',
                    onConfirm: async (notaExtra) => {
                        setLoadingId(group.id);
                        const pagoStr = (nuevoEstado === 'Entregado' && metodosPago[group.id]) ? ` | Pago: ${metodosPago[group.id]}` : '';
                        
                        // Añadimos los códigos de barras a la nota final
                        const codigosAgrupados = group.items.map(i => codigosBarras[i.id] ? `${i.producto}: ${codigosBarras[i.id]}` : null).filter(Boolean).join(', ');
                        const codigosStr = codigosAgrupados ? ` | Códigos Escaneados: [${codigosAgrupados}]` : '';

                        const observacionesFinales = (group.observaciones || '') + (notaExtra ? ` | Nota Rep: ${notaExtra}` : '') + pagoStr + codigosStr;

                        let allSuccess = true;
                        const promesas = group.items.map(async (item) => {
                            const kgAEnviar = nuevoEstado === 'Entregado' ? Number(kilosFisicos[item.id]) : Number(item.kilosPorCaja);
                            
                            const res = await sendPostRequest({
                                action: 'actualizarPedido',
                                pedidoId: item.id,
                                estado: nuevoEstado,
                                observaciones: observacionesFinales,
                                kilosPorCaja: kgAEnviar // El repartidor inyecta sus kilos físicos a la DB
                            });
                            if (res.status !== 'success') allSuccess = false;
                            return { res, kgAEnviar };
                        });

                        const resultados = await Promise.all(promesas);

                        if(allSuccess){
                            setOrders(prev => prev.map(o => {
                                const mod = group.items.find(i => i.id === o.id);
                                if (mod) {
                                    const targetRes = resultados[group.items.indexOf(mod)];
                                    return { ...o, estado: nuevoEstado, observaciones: observacionesFinales, kilosPorCaja: targetRes.kgAEnviar };
                                }
                                return o;
                            }));
                        } else {
                            showModal({ type: 'alert', title: 'Error', message: "Ocurrió un error al actualizar. Verifica conexión." });
                        }
                        setLoadingId(null);
                    }
                });
            };

            const moverPedido = (index, direccion) => {
                const nuevos = [...orderedGroups];
                if (direccion === 'up' && index > 0) {
                    [nuevos[index - 1], nuevos[index]] = [nuevos[index], nuevos[index - 1]];
                } else if (direccion === 'down' && index < nuevos.length - 1) {
                    [nuevos[index + 1], nuevos[index]] = [nuevos[index], nuevos[index + 1]];
                }
                setOrderedGroups(nuevos);
            };

            const buscarReferencias = (telefono) => {
                const cliente = clientes.find(c => (c.telefono || c.teléfono || '').toString().trim() === (telefono || '').toString().trim());
                if (!cliente) return "No hay referencias guardadas.";
                return cliente['dirección_/_referencias'] || cliente['direccion_/_referencias'] || cliente.referencias || cliente.direccion || "Sin referencias detalladas.";
            };

            return (
                <div className="space-y-4 max-w-lg mx-auto pb-20">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between sticky top-[70px] z-10">
                        <div>
                            <h2 className="text-lg font-black text-slate-800">Mi Ruta</h2>
                            <p className="text-xs text-slate-500">Ordena las entregas</p>
                        </div>
                        <div className="bg-slate-50 p-2 rounded-xl flex items-center gap-2 border border-slate-200">
                            <Icon name="CalendarDays" size={18} className="text-amber-500" />
                            <input type="date" value={filtroFecha} onChange={e => setFiltroFecha(e.target.value)} className="text-sm outline-none bg-transparent font-bold text-slate-700 w-[115px]" />
                        </div>
                    </div>

                    {orderedGroups.map((group, index) => {
                        // Calcular gran total en tiempo real usando lo que va escribiendo el repartidor
                        const granTotal = group.items.reduce((sum, item) => {
                            const kg = Number(kilosFisicos[item.id]) || 0;
                            return sum + (Number(item.cantidad) * kg * Number(item.precioAsignado));
                        }, 0);
                        const totalCajas = group.items.reduce((sum, item) => sum + Number(item.cantidad), 0);

                        return (
                            <div key={group.id} className={`bg-white rounded-2xl shadow-sm border ${group.estado === 'Entregado' ? 'border-green-200 bg-green-50/30' : 'border-slate-200'} p-5 transition-all`}>
                                <div className="flex justify-between items-start mb-3 border-b border-slate-100 pb-3">
                                    <div className="flex items-center gap-3">
                                        <div className="flex flex-col items-center bg-slate-100 rounded-lg p-1">
                                            <button onClick={() => moverPedido(index, 'up')} disabled={index === 0} className="text-slate-400 hover:text-amber-600 disabled:opacity-20 p-1"><Icon name="ArrowUp" size={18}/></button>
                                            <span className="text-xs font-black text-slate-600 px-1">{index + 1}</span>
                                            <button onClick={() => moverPedido(index, 'down')} disabled={index === orderedGroups.length - 1} className="text-slate-400 hover:text-amber-600 disabled:opacity-20 p-1"><Icon name="ArrowDown" size={18}/></button>
                                        </div>
                                        <div>
                                            <h3 className="font-black text-lg text-slate-800 leading-tight">{group.cliente.negocio}</h3>
                                            <p className="text-xs text-slate-500 mt-1 font-mono">Tel: {group.cliente.telefono}</p>
                                        </div>
                                    </div>
                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider ${group.estado === 'Entregado' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`}>{group.estado}</span>
                                </div>
                                
                                <div className="space-y-3">
                                    <div>
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide">Ubicación</p>
                                        <p className="text-sm text-slate-700 font-medium">{group.cliente.ubicacion}</p>
                                    </div>
                                    
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm">
                                        <p className="font-bold text-slate-700 text-xs mb-1 flex items-center gap-1"><Icon name="MapPin" size={14}/> Dirección y Referencias:</p>
                                        <p className="text-slate-600 italic text-xs leading-relaxed">{buscarReferencias(group.cliente.telefono)}</p>
                                    </div>
                                    
                                    <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-sm relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-1 h-full bg-amber-400"></div>
                                        <p className="text-xs text-amber-700 font-bold uppercase tracking-wider mb-3">Pesaje de la Entrega ({totalCajas} Cajas)</p>
                                        
                                        <div className="space-y-4 mb-4">
                                            {group.items.map(item => (
                                                <div key={item.id} className="text-amber-900 border-b border-amber-200/50 pb-3">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div className="flex-1">
                                                            <div className="font-bold text-sm leading-tight">{item.cantidad}x {item.producto}</div>
                                                            <div className="text-xs text-amber-700 mt-1">Precio fijo: ${item.precioAsignado}/Kg</div>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <div className="flex items-center bg-white p-1 rounded-lg border border-amber-300 shadow-inner">
                                                                <input 
                                                                    type="number" 
                                                                    value={kilosFisicos[item.id] || ""}
                                                                    onChange={(e) => handleKilosChange(item.id, e.target.value)}
                                                                    placeholder="0.0" 
                                                                    disabled={group.estado === 'Entregado'}
                                                                    className="w-16 p-1 text-center font-bold outline-none bg-transparent" 
                                                                />
                                                                <span className="text-xs font-bold text-amber-600 mr-2">Kg</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    {/* Sección del Código de Barras */}
                                                    <div className="flex items-center gap-2 mt-1">
                                                        <button onClick={() => setScannerActivo(item.id)} disabled={group.estado === 'Entregado'} className="bg-slate-800 text-white p-2 rounded-lg hover:bg-slate-700 transition disabled:opacity-50" title="Escanear Código">
                                                            <Icon name="ScanLine" size={16} />
                                                        </button>
                                                        <input 
                                                            type="text" 
                                                            value={codigosBarras[item.id] || ""}
                                                            onChange={(e) => handleCodigoBarrasChange(item.id, e.target.value)}
                                                            placeholder="Código escaneado..." 
                                                            disabled={group.estado === 'Entregado'}
                                                            className="flex-1 p-2 text-xs font-mono bg-white border border-amber-300 rounded-lg outline-none" 
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="text-right pt-2">
                                            <p className="text-xs text-amber-700/70 font-bold uppercase tracking-wider mb-0.5">Total Calculado</p>
                                            <p className="font-black text-3xl text-green-700">${granTotal.toFixed(2)}</p>
                                        </div>

                                        {group.observaciones && <p className="text-amber-800 text-xs mt-3 pt-2 border-t border-amber-200/50 italic bg-amber-100/50 p-2 rounded">"{group.observaciones}"</p>}
                                    </div>
                                </div>

                                <div className="flex flex-wrap gap-2 mt-5">
                                    <a href={`https://wa.me/52${group.cliente.telefono}?text=Hola,%20soy%20el%20repartidor.%20Voy%20en%20camino%20con%20su%20pedido.%20En%20un%20momento%20le%20adjunto%20su%20ticket%20de%20compra.`} target="_blank" className="flex-1 min-w-[100px] bg-green-500 text-white flex justify-center items-center gap-1.5 py-3 rounded-xl font-bold text-sm hover:bg-green-600 shadow-sm transition">
                                        <Icon name="MessageCircle" size={18}/> Whats
                                    </a>
                                    <a href={`tel:${group.cliente.telefono}`} className="flex-1 min-w-[100px] bg-blue-500 text-white flex justify-center items-center gap-1.5 py-3 rounded-xl font-bold text-sm hover:bg-blue-600 shadow-sm transition">
                                        <Icon name="Phone" size={18}/> Llamar
                                    </a>
                                    <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(group.cliente.ubicacion)}`} target="_blank" className="flex-1 min-w-[100px] bg-slate-800 text-white flex justify-center items-center gap-1.5 py-3 rounded-xl font-bold text-sm hover:bg-slate-900 shadow-sm transition">
                                        <Icon name="MapPin" size={18}/> Ruta
                                    </a>
                                </div>

                                {group.estado !== 'Entregado' && group.estado !== 'Cancelado' && (
                                    <>
                                        <div className="mt-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Método de Cobro / Pago</label>
                                            <select 
                                                value={metodosPago[group.id] || ""}
                                                onChange={(e) => handleMetodoPagoChange(group.id, e.target.value)}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-amber-500 font-medium cursor-pointer"
                                            >
                                                <option value="">Seleccione una opción...</option>
                                                <option value="Efectivo">💵 Efectivo</option>
                                                <option value="Transferencia">📱 Transferencia</option>
                                                <option value="Credito">💳 Crédito</option>
                                                <option value="Parcialidades">⏱️ Parcialidades</option>
                                                <option value="Otro">📝 Otro</option>
                                            </select>
                                        </div>
                                        
                                        <button onClick={() => generarTicketPDF(group, granTotal, totalCajas)} className="w-full mt-3 bg-red-50 text-red-600 py-3 rounded-xl font-bold hover:bg-red-100 transition text-sm flex justify-center items-center gap-2 border border-red-200 shadow-sm">
                                            <Icon name="FileText" size={18} /> Descargar Ticket PDF
                                        </button>

                                        <div className="grid grid-cols-2 gap-3 border-t border-slate-100 pt-4 mt-4">
                                            <button onClick={() => cambiarEstadoGrupo(group, 'Entregado')} disabled={loadingId === group.id} className="bg-emerald-100 text-emerald-800 py-3 rounded-xl font-bold hover:bg-emerald-200 transition text-sm flex justify-center items-center gap-2 disabled:opacity-50 border border-emerald-200 shadow-sm">
                                                {loadingId === group.id ? <Icon name="Loader" size={18} /> : <Icon name="CheckCircle" size={18} />} Entregado
                                            </button>
                                            <button onClick={() => cambiarEstadoGrupo(group, 'Reprogramado')} disabled={loadingId === group.id} className="bg-orange-50 text-orange-700 py-3 rounded-xl font-bold hover:bg-orange-100 transition text-sm border border-orange-200 disabled:opacity-50 shadow-sm">
                                                Reprogramar
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        );
                    })}
                    
                    {orderedGroups.length === 0 && (
                        <div className="text-center p-10 bg-slate-100 border-2 border-dashed border-slate-300 rounded-3xl text-slate-500 mt-4">
                            <Icon name="CalendarDays" size={48} className="mx-auto mb-4 text-slate-400 opacity-50" />
                            <p className="font-medium text-lg">Día libre</p>
                            <p className="text-sm">No tienes entregas asignadas para esta fecha.</p>
                        </div>
                    )}
                    
                    {scannerActivo && (
                        <ScannerModal 
                            onScan={(text) => {
                                handleCodigoBarrasChange(scannerActivo, text);
                                setScannerActivo(null);
                            }} 
                            onClose={() => setScannerActivo(null)} 
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [users, setUsers] = useState([]);
            const [orders, setOrders] = useState([]);
            const [clientes, setClientes] = useState([]);
            const [productos, setProductos] = useState([]);
            const [isLoadingApp, setIsLoadingApp] = useState(true);
            const [error, setError] = useState(null);
            
            const [modalConfig, setModalConfig] = useState(null);

            useEffect(() => {
                const fetchAllData = async () => {
                    try {
                        const urls = [
                            `${SCRIPT_URL}?action=getUsuarios`,
                            `${SCRIPT_URL}?action=getProductos`,
                            `${SCRIPT_URL}?action=getVentas`,
                            `${SCRIPT_URL}?action=getClientes`
                        ];

                        const responses = await Promise.all(urls.map(url => fetch(url).then(res => res.json())));
                        const [resUsuarios, resProductos, resVentas, resClientes] = responses;

                        if(resUsuarios.status === 'success') setUsers(resUsuarios.data);
                        if(resProductos.status === 'success') setProductos(resProductos.data);
                        if(resClientes.status === 'success') setClientes(resClientes.data);
                        
                        if(resVentas.status === 'success') {
                            const mappedOrders = resVentas.data.map(v => ({
                                id: v.id_pedido || v.id,
                                vendedorId: v.vendedor_id || v.vendedor,
                                cliente: {
                                    telefono: v.telefono || v.teléfono,
                                    negocio: v.negocio,
                                    ubicacion: v.ubicacion || v.ubicación
                                },
                                producto: v.producto,
                                cantidad: v.cantidad,
                                // ESTO CORRIGE LA FECHA PARA TODOS LOS NAVEGADORES
                                fechaEntrega: v.fecha_entrega ? v.fecha_entrega.toString().split('T')[0] : "",
                                observaciones: v.observaciones,
                                estado: v.estado || 'Pendiente',
                                repartidorId: v.repartidor_id || v.repartidor,
                                precioAsignado: Number(v.precio) || 0,
                                kilosPorCaja: Number(v.kilos) || 0
                            }));
                            setOrders(mappedOrders);
                        }
                    } catch (err) {
                        console.error(err);
                        setError("Error al conectar con la base de datos de Google. Verifica tu conexión.");
                    } finally {
                        setIsLoadingApp(false);
                    }
                };
                
                fetchAllData();
            }, []);

            if (isLoadingApp) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-50 text-amber-600">
                        <Icon name="Loader" size={48} className="mb-6 drop-shadow-md" />
                        <h2 className="text-2xl font-black text-slate-800 tracking-tight">Conectando Sistema</h2>
                        <p className="text-slate-500 text-sm mt-2 font-medium">Sincronizando con Google Sheets...</p>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
                        <div className="bg-white p-8 rounded-3xl shadow-lg border border-red-100 text-center max-w-md w-full">
                            <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="Trash2" size={32} /></div>
                            <p className="font-black text-xl mb-2 text-slate-800">Error de conexión</p>
                            <p className="text-sm text-slate-600 leading-relaxed">{error}</p>
                        </div>
                    </div>
                );
            }

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50/50">
                        <div className="bg-white p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] w-full max-w-md border border-slate-100">
                            <div className="w-20 h-20 bg-gradient-to-br from-amber-400 to-amber-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-amber-500/30 transform rotate-3">
                                <Icon name="User" size={36} className="-rotate-3" />
                            </div>
                            <h1 className="text-2xl font-black text-center text-slate-800 mb-2 tracking-tight">Acceso al Sistema</h1>
                            <p className="text-sm text-slate-500 text-center mb-8 font-medium">Selecciona tu perfil para continuar</p>
                            
                            <div className="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                {users.map((u, i) => (
                                    <button key={i} onClick={() => setCurrentUser(u)} className="w-full p-4 border-2 border-slate-100 rounded-2xl flex items-center justify-between hover:border-amber-400 hover:bg-amber-50 transition-all group text-left">
                                        <div>
                                            <p className="font-black text-slate-700 group-hover:text-amber-800">{u.nombre}</p>
                                            <p className="text-xs text-slate-400 uppercase font-bold tracking-widest mt-1 group-hover:text-amber-600/70">{u.rol || 'Sin Rol'}</p>
                                        </div>
                                        <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-amber-200 group-hover:text-amber-700 transition">
                                            <Icon name="ArrowDown" className="-rotate-90" size={16} />
                                        </div>
                                    </button>
                                ))}
                                {users.length === 0 && <p className="text-center text-slate-400 text-sm p-4 bg-slate-50 rounded-xl">No se encontraron usuarios en Google Sheets.</p>}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-100/50">
                    <header className="bg-white border-b border-slate-200 p-4 sticky top-0 z-40 backdrop-blur-md bg-white/90 shadow-sm">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-amber-400 to-amber-600 rounded-xl flex items-center justify-center text-white shadow-sm">
                                    <span className="font-black text-lg">H</span>
                                </div>
                                <div>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tight leading-tight">Control<span className="text-amber-500">Huevos</span></h1>
                                    <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">{currentUser.nombre} • {(currentUser.rol || 'N/A')}</p>
                                </div>
                            </div>
                            <button onClick={() => setCurrentUser(null)} className="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-red-50 hover:text-red-600 rounded-full transition text-slate-600" title="Cerrar Sesión">
                                <Icon name="LogOut" size={18} />
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-6xl mx-auto p-4 md:p-6 mt-2">
                        {(currentUser.rol||'').toLowerCase() === 'vendedor' && <VendedorView user={currentUser} setOrders={setOrders} clientes={clientes} productos={productos} showModal={setModalConfig} />}
                        {(currentUser.rol||'').toLowerCase() === 'admin' && <AdminView orders={orders} setOrders={setOrders} users={users} clientes={clientes} showModal={setModalConfig} />}
                        {(currentUser.rol||'').toLowerCase() === 'repartidor' && <RepartidorView user={currentUser} orders={orders} setOrders={setOrders} clientes={clientes} showModal={setModalConfig} />}
                        {!(currentUser.rol||'').toLowerCase().match(/^(vendedor|admin|repartidor)$/) && (
                            <div className="text-center mt-20 p-8 bg-white rounded-3xl shadow-sm max-w-md mx-auto border border-slate-200">
                                <Icon name="CheckCircle" size={48} className="mx-auto mb-4 text-slate-300" />
                                <p className="font-bold text-lg text-slate-700">Acceso Restringido</p>
                                <p className="text-sm text-slate-500 mt-2">Tu usuario no tiene un rol válido asignado. Contacta al administrador.</p>
                            </div>
                        )}
                    </main>

                    <CustomModal config={modalConfig} onClose={() => setModalConfig(null)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
