<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ventas - Cajas de Huevo</title>
    
    <!-- Tailwind CSS para diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // CONFIGURACIÓN API
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgF1W6GhcPPm0TTUcIq7r2JP5qufXizBPkKPgqpgIGVI6qQmKjPQ_0j2yR_qVT4KglRw/exec";

        // Función auxiliar para enviar datos a Google Apps Script
        const sendPostRequest = async (data) => {
            try {
                // Usamos text/plain para evitar problemas de CORS preflight con Google Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error("Error en POST:", error);
                return { status: 'error', message: error.message };
            }
        };

        // ==========================================
        // COMPONENTES DE ICONOS
        // ==========================================
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                User: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                MapPin: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
                Phone: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
                MessageCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
                CheckCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
                LogOut: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
                Save: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
                Loader: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className} animate-spin"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>`,
                Trash2: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
                Plus: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`
            };
            return <span dangerouslySetInnerHTML={{ __html: icons[name] }} />;
        };

        // ==========================================
        // VISTAS POR TIPO DE USUARIO
        // ==========================================

        // --- VISTA VENDEDOR ---
        const VendedorView = ({ user, setOrders, clientes, productos }) => {
            const [telefono, setTelefono] = useState("");
            const [cliente, setCliente] = useState(null);
            
            // Nuevos estados para manejar múltiples líneas
            const [fecha, setFecha] = useState("");
            const [observaciones, setObservaciones] = useState("");
            const [lineas, setLineas] = useState([]);
            
            const [loading, setLoading] = useState(false);

            // Iniciar con al menos una línea de producto seleccionada por defecto
            useEffect(() => {
                if (productos && productos.length > 0 && lineas.length === 0) {
                    setLineas([{ id: Date.now(), productoId: productos[0].id || productos[0].nombre, cantidad: 1 }]);
                }
            }, [productos, lineas.length]);

            const buscarCliente = () => {
                const encontrado = clientes.find(c => {
                    const telDb = String(c.telefono || c.teléfono || "").trim();
                    return telDb === telefono.trim();
                });
                setCliente(encontrado || { noEncontrado: true });
            };

            const agregarLinea = () => {
                const defaultProd = productos.length > 0 ? (productos[0].id || productos[0].nombre) : "";
                setLineas([...lineas, { id: Date.now(), productoId: defaultProd, cantidad: 1 }]);
            };

            const removerLinea = (idToRemove) => {
                setLineas(lineas.filter(l => l.id !== idToRemove));
            };

            const actualizarLinea = (id, campo, valor) => {
                setLineas(lineas.map(l => l.id === id ? { ...l, [campo]: valor } : l));
            };

            const guardarPedido = async (e) => {
                e.preventDefault();
                if (lineas.length === 0) return alert("Agrega al menos un producto.");
                setLoading(true);

                const baseId = Date.now().toString().slice(-6);
                let successCount = 0;
                const nuevosPedidos = [];

                // Guardamos cada línea de producto secuencialmente para que Google Sheets registre filas independientes
                for (let i = 0; i < lineas.length; i++) {
                    const linea = lineas[i];
                    const prodSeleccionado = productos.find(p => (p.id || p.nombre) === linea.productoId);
                    const nombreProducto = prodSeleccionado ? (prodSeleccionado.nombre || prodSeleccionado.producto) : linea.productoId;

                    const nuevoPedido = {
                        // Si hay varios productos, les agregamos un sufijo (-1, -2, etc) al ID
                        id: lineas.length > 1 ? `PED-${baseId}-${i+1}` : `PED-${baseId}`,
                        vendedorId: user.id || user.nombre,
                        cliente: {
                            telefono: cliente.telefono || cliente.teléfono,
                            negocio: cliente.negocio,
                            ubicacion: cliente.ubicacion || cliente.ubicación
                        },
                        producto: nombreProducto,
                        cantidad: linea.cantidad,
                        fechaEntrega: fecha,
                        observaciones: observaciones
                    };

                    const res = await sendPostRequest({ action: 'nuevoPedido', pedido: nuevoPedido });

                    if (res.status === 'success') {
                        successCount++;
                        nuevosPedidos.push({ ...nuevoPedido, estado: 'Pendiente', precioAsignado: 0, kilosPorCaja: 0 });
                    }
                }

                if (successCount === lineas.length) {
                    setOrders(prev => [...prev, ...nuevosPedidos]);
                    alert("¡Pedido guardado con éxito!");
                    // Reiniciar el formulario
                    setTelefono(""); 
                    setCliente(null); 
                    setFecha(""); 
                    setObservaciones("");
                    const defaultProd = productos.length > 0 ? (productos[0].id || productos[0].nombre) : "";
                    setLineas([{ id: Date.now(), productoId: defaultProd, cantidad: 1 }]);
                } else if (successCount > 0) {
                    setOrders(prev => [...prev, ...nuevosPedidos]);
                    alert(`Atención: Se guardaron ${successCount} de ${lineas.length} productos. Hubo un error de conexión con el resto.`);
                } else {
                    alert("Error al guardar. No se pudo registrar ningún producto. Verifica tu conexión.");
                }
                setLoading(false);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <h2 className="text-2xl font-bold text-amber-600">Nuevo Pedido</h2>
                    
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <label className="block text-sm font-medium text-slate-700 mb-2">Teléfono del Cliente</label>
                        <div className="flex gap-2">
                            <input type="text" value={telefono} onChange={e => setTelefono(e.target.value)} placeholder="Ej. 5551234567" className="flex-1 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none" />
                            <button onClick={buscarCliente} className="bg-amber-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-amber-600 transition">Buscar</button>
                        </div>

                        {cliente && !cliente.noEncontrado && (
                            <div className="mt-4 p-4 bg-slate-50 rounded-lg border border-slate-100 text-sm">
                                <p><strong>Negocio:</strong> {cliente.negocio}</p>
                                <p><strong>Giro:</strong> {cliente.giro}</p>
                                <p><strong>Encargado:</strong> {cliente.encargado}</p>
                                <p className="flex items-center gap-1 mt-1">
                                    <strong>Ubicación:</strong> {cliente.ubicacion || cliente.ubicación} 
                                    <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cliente.ubicacion || cliente.ubicación)}`} target="_blank" className="text-blue-500 flex items-center gap-1 ml-2 hover:underline">
                                        <Icon name="MapPin" size={16} /> Ver en Maps
                                    </a>
                                </p>
                            </div>
                        )}
                        {cliente?.noEncontrado && <p className="text-red-500 text-sm mt-2">Cliente no encontrado. Verifica en la hoja de Clientes.</p>}
                    </div>

                    {cliente && !cliente.noEncontrado && (
                        <form onSubmit={guardarPedido} className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                            <h3 className="font-semibold border-b pb-2">Detalles del Pedido</h3>
                            
                            <div className="space-y-3">
                                <label className="block text-sm font-medium text-slate-700">Productos a surtir</label>
                                {lineas.map((linea) => (
                                    <div key={linea.id} className="flex gap-3 items-center">
                                        <div className="flex-1">
                                            <select value={linea.productoId} onChange={e => actualizarLinea(linea.id, 'productoId', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg outline-none bg-slate-50">
                                                {productos.map(p => <option key={p.id || p.nombre} value={p.id || p.nombre}>{p.nombre || p.producto}</option>)}
                                            </select>
                                        </div>
                                        <div className="w-24">
                                            <input type="number" min="1" value={linea.cantidad} onChange={e => actualizarLinea(linea.id, 'cantidad', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg outline-none bg-slate-50" required placeholder="Cajas" />
                                        </div>
                                        {lineas.length > 1 && (
                                            <button type="button" onClick={() => removerLinea(linea.id)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg transition" title="Quitar">
                                                <Icon name="Trash2" size={20} />
                                            </button>
                                        )}
                                    </div>
                                ))}
                                <button type="button" onClick={agregarLinea} className="text-sm font-medium text-amber-600 hover:text-amber-700 flex items-center gap-1 mt-2 p-1">
                                    <Icon name="Plus" size={16} /> Añadir otro tipo de huevo
                                </button>
                            </div>

                            <div className="grid grid-cols-1 gap-4 pt-4 border-t">
                                <div>
                                    <label className="block text-sm font-medium mb-1 text-slate-700">Fecha de Entrega</label>
                                    <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg outline-none" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1 text-slate-700">Observaciones (Horario, kg, etc.)</label>
                                    <textarea value={observaciones} onChange={e => setObservaciones(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg outline-none" rows="2" placeholder="Ej. Entregar después de las 2 PM..."></textarea>
                                </div>
                            </div>
                            
                            <button type="submit" disabled={loading} className="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition flex justify-center items-center gap-2 disabled:opacity-70 mt-4">
                                {loading ? <Icon name="Loader" /> : null}
                                {loading ? 'Guardando...' : 'Confirmar Pedido'}
                            </button>
                        </form>
                    )}
                </div>
            );
        };

        // --- VISTA ADMINISTRADOR ---
        const AdminView = ({ orders, setOrders, users }) => {
            const [tab, setTab] = useState('pedidos');
            const [loadingId, setLoadingId] = useState(null);

            // Estado local para editar en tabla antes de guardar
            const [editState, setEditState] = useState({});

            // Inicializar estado editable
            useEffect(() => {
                const state = {};
                orders.forEach(o => {
                    state[o.id] = { 
                        repartidorId: o.repartidorId || "", 
                        precioAsignado: o.precioAsignado || "", 
                        kilosPorCaja: o.kilosPorCaja || "" 
                    };
                });
                setEditState(state);
            }, [orders]);

            const handleEdit = (id, field, value) => {
                setEditState(prev => ({ ...prev, [id]: { ...prev[id], [field]: value } }));
            };

            const guardarCambiosFila = async (pedidoId) => {
                setLoadingId(pedidoId);
                const cambios = editState[pedidoId];
                
                const dataToSave = {
                    action: 'actualizarPedido',
                    pedidoId: pedidoId,
                    repartidorId: cambios.repartidorId,
                    precioAsignado: parseFloat(cambios.precioAsignado) || 0,
                    kilosPorCaja: parseFloat(cambios.kilosPorCaja) || 0,
                    estado: cambios.repartidorId ? 'Asignado' : 'Pendiente'
                };

                const res = await sendPostRequest(dataToSave);
                
                if(res.status === 'success'){
                     // Actualizar interfaz principal
                     setOrders(orders.map(o => o.id === pedidoId ? { 
                         ...o, 
                         repartidorId: cambios.repartidorId, 
                         precioAsignado: dataToSave.precioAsignado,
                         kilosPorCaja: dataToSave.kilosPorCaja,
                         estado: dataToSave.estado
                     } : o));
                     alert("Pedido actualizado en la base de datos.");
                } else {
                     alert("Error: " + res.message);
                }
                setLoadingId(null);
            };

            const repartidores = users.filter(u => u.rol && u.rol.toLowerCase() === 'repartidor');

            return (
                <div className="space-y-6">
                    <div className="flex space-x-2 border-b border-slate-200">
                        {['pedidos', 'usuarios', 'dashboard'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 font-medium capitalize ${tab === t ? 'text-amber-600 border-b-2 border-amber-600' : 'text-slate-500 hover:text-amber-500'}`}>
                                {t}
                            </button>
                        ))}
                    </div>

                    {tab === 'pedidos' && (
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 text-slate-600">
                                        <tr>
                                            <th className="p-3">ID / Fecha</th>
                                            <th className="p-3">Cliente</th>
                                            <th className="p-3">Pedido</th>
                                            <th className="p-3">Asignar Repartidor</th>
                                            <th className="p-3">Precio / Kilos</th>
                                            <th className="p-3 text-center">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {orders.map(o => (
                                            <tr key={o.id} className="hover:bg-slate-50">
                                                <td className="p-3 whitespace-nowrap">
                                                    <span className="font-semibold">{o.id}</span><br/>
                                                    <span className="text-xs text-slate-500">{o.fechaEntrega}</span>
                                                    <br/>
                                                    <span className={`inline-block mt-1 px-2 py-0.5 rounded-full text-[10px] font-semibold ${o.estado === 'Entregado' ? 'bg-green-100 text-green-700' : o.estado === 'Asignado' ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                        {o.estado}
                                                    </span>
                                                </td>
                                                <td className="p-3 max-w-[200px] truncate" title={o.cliente.negocio}>{o.cliente.negocio} <br/><span className="text-xs text-slate-500 truncate block" title={o.cliente.ubicacion}>{o.cliente.ubicacion}</span></td>
                                                <td className="p-3">{o.cantidad}x {o.producto}</td>
                                                <td className="p-3">
                                                    {editState[o.id] && (
                                                        <select value={editState[o.id].repartidorId} onChange={(e) => handleEdit(o.id, 'repartidorId', e.target.value)} className="p-1.5 border border-slate-300 rounded text-sm w-full max-w-[150px] outline-none">
                                                            <option value="">Sin asignar</option>
                                                            {repartidores.map(r => <option key={r.id || r.nombre} value={r.id || r.nombre}>{r.nombre}</option>)}
                                                        </select>
                                                    )}
                                                </td>
                                                <td className="p-3 space-y-1">
                                                    {editState[o.id] && (
                                                        <>
                                                            <input type="number" placeholder="$ Precio" value={editState[o.id].precioAsignado} onChange={(e) => handleEdit(o.id, 'precioAsignado', e.target.value)} className="p-1 border border-slate-300 rounded w-20 text-sm outline-none" />
                                                            <input type="number" placeholder="Kilos" value={editState[o.id].kilosPorCaja} onChange={(e) => handleEdit(o.id, 'kilosPorCaja', e.target.value)} className="p-1 border border-slate-300 rounded w-20 text-sm block outline-none" />
                                                        </>
                                                    )}
                                                </td>
                                                <td className="p-3 text-center">
                                                    <button onClick={() => guardarCambiosFila(o.id)} disabled={loadingId === o.id || o.estado === 'Entregado'} className="bg-amber-100 text-amber-700 p-2 rounded hover:bg-amber-200 transition disabled:opacity-50" title="Guardar Cambios">
                                                        {loadingId === o.id ? <Icon name="Loader" size={18} /> : <Icon name="Save" size={18} />}
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                        {orders.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-slate-500">No hay pedidos registrados</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {tab === 'usuarios' && (
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-semibold mb-4 text-lg">Directorio de Usuarios</h3>
                            <ul className="divide-y divide-slate-100">
                                {users.map((u, i) => (
                                    <li key={i} className="py-3 flex justify-between items-center">
                                        <div>
                                            <p className="font-medium text-slate-800">{u.nombre}</p>
                                            <p className="text-sm text-slate-500">Usuario: {u.username || u.usuario || 'N/A'}</p>
                                        </div>
                                        <span className={`px-3 py-1 rounded-full text-xs uppercase font-bold tracking-wide ${(u.rol||'').toLowerCase() === 'admin' ? 'bg-purple-100 text-purple-700' : (u.rol||'').toLowerCase() === 'vendedor' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                            {u.rol || 'Sin Rol'}
                                        </span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {tab === 'dashboard' && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-amber-500">
                                <p className="text-slate-500 text-sm">Total Pedidos</p>
                                <p className="text-3xl font-bold text-slate-800">{orders.length}</p>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-500">
                                <p className="text-slate-500 text-sm">Entregados</p>
                                <p className="text-3xl font-bold text-slate-800">{orders.filter(o => o.estado === 'Entregado').length}</p>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-blue-500">
                                <p className="text-slate-500 text-sm">Ingresos Estimados</p>
                                <p className="text-3xl font-bold text-slate-800">
                                    ${orders.filter(o => o.estado === 'Entregado').reduce((acc, curr) => acc + (curr.precioAsignado * curr.cantidad), 0).toFixed(2)}
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- VISTA REPARTIDOR ---
        const RepartidorView = ({ user, orders, setOrders }) => {
            const [loadingId, setLoadingId] = useState(null);

            // Filtrar mis pedidos activos y ordenados por fecha
            const misPedidos = orders
                .filter(o => o.repartidorId === (user.id || user.nombre))
                .sort((a, b) => new Date(a.fechaEntrega) - new Date(b.fechaEntrega));

            const cambiarEstado = async (id, nuevoEstado, obsActuales) => {
                const notaExtra = prompt(`Cambiar estado a ${nuevoEstado}. ¿Agregar alguna nota para el cliente o admin?`);
                if(notaExtra === null) return; // Canceló el prompt

                setLoadingId(id);
                const observacionesFinales = obsActuales + (notaExtra ? ` | Nota Repartidor: ${notaExtra}` : '');

                const res = await sendPostRequest({
                    action: 'actualizarPedido',
                    pedidoId: id,
                    estado: nuevoEstado,
                    observaciones: observacionesFinales
                });

                if(res.status === 'success'){
                    setOrders(orders.map(o => o.id === id ? { ...o, estado: nuevoEstado, observaciones: observacionesFinales } : o));
                } else {
                    alert("Error al actualizar: " + res.message);
                }
                setLoadingId(null);
            };

            return (
                <div className="space-y-4 max-w-lg mx-auto pb-10">
                    <h2 className="text-xl font-bold text-slate-800">Mi Ruta de Entrega</h2>
                    <p className="text-sm text-slate-500 mb-4">Pedidos asignados ordenados por prioridad.</p>

                    {misPedidos.map((o, index) => (
                        <div key={o.id} className={`bg-white rounded-xl shadow-sm border border-slate-200 p-4 ${o.estado === 'Entregado' ? 'opacity-60' : ''}`}>
                            <div className="flex justify-between items-start mb-2">
                                <span className="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs font-bold">#{index + 1}</span>
                                <span className={`text-xs font-bold px-2 py-1 rounded-full ${o.estado === 'Entregado' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`}>{o.estado}</span>
                            </div>
                            
                            <h3 className="font-bold text-lg">{o.cliente.negocio}</h3>
                            <p className="text-sm text-slate-600 mb-1">{o.cliente.ubicacion}</p>
                            
                            <div className="bg-amber-50 p-3 rounded-lg my-3 border border-amber-100 text-sm">
                                <p><strong>Entrega:</strong> {o.cantidad} cajas de {o.producto}</p>
                                <p><strong>Cobro:</strong> ${o.precioAsignado} ( {o.kilosPorCaja} kg/caja )</p>
                                {o.observaciones && <p className="text-amber-800 text-xs mt-1 italic">"{o.observaciones}"</p>}
                            </div>

                            <div className="flex flex-wrap gap-2 mb-4">
                                <a href={`https://wa.me/52${o.cliente.telefono}?text=Hola, soy el repartidor. Voy en camino con su pedido de ${o.cantidad} cajas de huevo.`} target="_blank" className="flex-1 min-w-[120px] bg-green-500 text-white flex justify-center items-center gap-2 py-2 rounded-lg font-medium text-sm hover:bg-green-600">
                                    <Icon name="MessageCircle" size={16}/> WhatsApp
                                </a>
                                <a href={`tel:${o.cliente.telefono}`} className="flex-1 min-w-[120px] bg-blue-500 text-white flex justify-center items-center gap-2 py-2 rounded-lg font-medium text-sm hover:bg-blue-600">
                                    <Icon name="Phone" size={16}/> Llamar
                                </a>
                                <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.cliente.ubicacion)}`} target="_blank" className="flex-1 min-w-[120px] bg-slate-800 text-white flex justify-center items-center gap-2 py-2 rounded-lg font-medium text-sm hover:bg-slate-900">
                                    <Icon name="MapPin" size={16}/> Mapas
                                </a>
                            </div>

                            {o.estado !== 'Entregado' && o.estado !== 'Cancelado' && (
                                <div className="grid grid-cols-2 gap-2 border-t pt-3 mt-2">
                                    <button onClick={() => cambiarEstado(o.id, 'Entregado', o.observaciones)} disabled={loadingId === o.id} className="bg-emerald-100 text-emerald-700 py-2 rounded font-medium hover:bg-emerald-200 transition text-sm flex justify-center items-center gap-1 disabled:opacity-50">
                                        {loadingId === o.id ? <Icon name="Loader" size={16} /> : 'Marcar Entregado'}
                                    </button>
                                    <button onClick={() => cambiarEstado(o.id, 'Reprogramado', o.observaciones)} disabled={loadingId === o.id} className="bg-orange-100 text-orange-700 py-2 rounded font-medium hover:bg-orange-200 transition text-sm disabled:opacity-50">
                                        Cambiar Fecha
                                    </button>
                                </div>
                            )}
                        </div>
                    ))}
                    
                    {misPedidos.length === 0 && (
                        <div className="text-center p-8 bg-slate-100 rounded-xl text-slate-500">
                            No tienes pedidos asignados actualmente.
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        const App = () => {
            const [currentUser, setCurrentUser] = useState(null);
            
            // Estado global
            const [users, setUsers] = useState([]);
            const [orders, setOrders] = useState([]);
            const [clientes, setClientes] = useState([]);
            const [productos, setProductos] = useState([]);
            const [isLoadingApp, setIsLoadingApp] = useState(true);
            const [error, setError] = useState(null);

            // Cargar datos al iniciar la app
            useEffect(() => {
                const fetchAllData = async () => {
                    try {
                        const urls = [
                            `${SCRIPT_URL}?action=getUsuarios`,
                            `${SCRIPT_URL}?action=getProductos`,
                            `${SCRIPT_URL}?action=getVentas`,
                            `${SCRIPT_URL}?action=getClientes`
                        ];

                        const responses = await Promise.all(urls.map(url => fetch(url).then(res => res.json())));
                        
                        const [resUsuarios, resProductos, resVentas, resClientes] = responses;

                        if(resUsuarios.status === 'success') setUsers(resUsuarios.data);
                        if(resProductos.status === 'success') setProductos(resProductos.data);
                        if(resClientes.status === 'success') setClientes(resClientes.data);
                        
                        if(resVentas.status === 'success') {
                            // Mapeamos las columnas del excel (que el script devuelve en minúsculas) al formato de React
                            const mappedOrders = resVentas.data.map(v => ({
                                id: v.id_pedido || v.id,
                                vendedorId: v.vendedor_id || v.vendedor,
                                cliente: {
                                    telefono: v.telefono || v.teléfono,
                                    negocio: v.negocio,
                                    ubicacion: v.ubicacion || v.ubicación
                                },
                                producto: v.producto,
                                cantidad: v.cantidad,
                                fechaEntrega: v.fecha_entrega,
                                observaciones: v.observaciones,
                                estado: v.estado || 'Pendiente',
                                repartidorId: v.repartidor_id || v.repartidor,
                                precioAsignado: Number(v.precio) || 0,
                                kilosPorCaja: Number(v.kilos) || 0
                            }));
                            setOrders(mappedOrders);
                        }
                    } catch (err) {
                        console.error(err);
                        setError("Error al conectar con la base de datos de Google. Verifica la URL de tu Apps Script.");
                    } finally {
                        setIsLoadingApp(false);
                    }
                };
                
                fetchAllData();
            }, []);

            // Pantalla de Carga
            if (isLoadingApp) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-100 text-amber-600">
                        <Icon name="Loader" size={48} className="mb-4" />
                        <h2 className="text-xl font-bold text-slate-700">Conectando con Google Sheets...</h2>
                        <p className="text-slate-500 text-sm mt-2">Cargando usuarios, clientes y pedidos</p>
                    </div>
                );
            }

            // Error crítico
            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100 text-red-600">
                        <div className="bg-white p-6 rounded-xl shadow border border-red-200 text-center max-w-md">
                            <p className="font-bold text-lg mb-2">Error de conexión</p>
                            <p className="text-sm">{error}</p>
                        </div>
                    </div>
                );
            }

            // Pantalla de Login (Basada en la hoja "Usuarios")
            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <Icon name="User" size={32} />
                            </div>
                            <h1 className="text-2xl font-bold text-center text-slate-800 mb-2">Acceso al Sistema</h1>
                            <p className="text-sm text-slate-500 text-center mb-6">Selecciona tu usuario de la base de datos</p>
                            
                            <div className="space-y-3 max-h-96 overflow-y-auto pr-2">
                                {users.map((u, i) => (
                                    <button key={i} onClick={() => setCurrentUser(u)} className="w-full p-4 border border-slate-200 rounded-xl flex items-center justify-between hover:bg-amber-50 hover:border-amber-300 transition group text-left">
                                        <div>
                                            <p className="font-bold text-slate-800 group-hover:text-amber-700">{u.nombre}</p>
                                            <p className="text-xs text-slate-500 uppercase font-semibold tracking-wider mt-1">{u.rol || 'Sin Rol'}</p>
                                        </div>
                                    </button>
                                ))}
                                {users.length === 0 && <p className="text-center text-slate-500 text-sm">No se encontraron usuarios en la hoja "Usuarios".</p>}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold text-amber-400">ControlHuevos<span className="text-white">Pro</span></h1>
                                <p className="text-xs text-slate-400">Hola, {currentUser.nombre} ({(currentUser.rol || 'N/A').toUpperCase()})</p>
                            </div>
                            <button onClick={() => setCurrentUser(null)} className="p-2 hover:bg-slate-800 rounded-full transition text-slate-300 hover:text-white" title="Cerrar Sesión">
                                <Icon name="LogOut" size={20} />
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 w-full max-w-6xl mx-auto p-4 md:p-6">
                        {(currentUser.rol||'').toLowerCase() === 'vendedor' && <VendedorView user={currentUser} setOrders={setOrders} clientes={clientes} productos={productos} />}
                        {(currentUser.rol||'').toLowerCase() === 'admin' && <AdminView orders={orders} setOrders={setOrders} users={users} />}
                        {(currentUser.rol||'').toLowerCase() === 'repartidor' && <RepartidorView user={currentUser} orders={orders} setOrders={setOrders} />}
                        {!(currentUser.rol||'').toLowerCase().match(/^(vendedor|admin|repartidor)$/) && <p className="text-center mt-10 text-slate-500">Tu usuario no tiene un rol válido asignado (debe ser admin, vendedor o repartidor).</p>}
                    </main>
                </div>
            );
        };

        // Renderizar React
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
